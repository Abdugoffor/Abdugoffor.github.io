</style></head><body><div class="overlay" id="overlay"></div><div class="app"><aside class="sidebar" id="sidebar"><div class="sidebar-brand"><div class="brand-name">GO SYSTEMS / FIELD GUIDE</div><div class="brand-title">Concurrency<br>Engineering<span style="color:#58dcc7">.</span></div><div class="brand-sub">O‘zbekcha · Junior → Senior</div></div><div class="side-search"><label for="searchInput">MAVZULARNI QIDIRISH · /</label><input id="searchInput" type="search" placeholder="Masalan: CAS, GMP, MVCC"></div><div id="searchStatus" class="search-status"></div><div class="side-actions"><button id="expandAll">Modullarni ochish</button><button id="clearProgress">Progressni tozalash</button></div><button class="nav-overview" id="navHome">⌂ &nbsp; Bosh sahifa va dastur</button><div class="nav-title">10 MODUL · MAVZULAR</div><nav id="navModules" aria-label="Dars navigatsiyasi"></nav><div class="side-foot">70 batafsil dars · 210 Go misol<br>300+ tushuncha · 10 modul testi<br>Offline, bitta HTML fayl</div></aside><div class="workspace"><header class="topbar"><div class="top-left"><button class="hamburger" id="hamburger" aria-label="Menyuni ochish">☰</button><div id="crumb" class="crumb">Bosh sahifa</div></div><div class="top-actions"><div class="progress-mini" title="Darslar progressi"><span id="progressMini"></span></div><span class="progress-label" id="progressLabel">0/70</span><button id="themeBtn" class="theme-btn">🌙 Tungi</button></div></header><main class="main" id="content"></main></div></div><div id="toast" class="toast" role="status"></div><script type="application/json" id="dataset">{"modules":[{"id":"m1","num":1,"title":"CPU, OS va xotira asoslari","summary":"Dastur qanday bajariladi: apparat, RAM, process va concurrency.","goal":"Go kodining tezligi nima uchun faqat goroutine soniga bog‘liq emasligini tushunish.","homework":"Key–value DB arxitekturasi va SET/GET parserini loyihalash.","topics":[{"id":"m1-t1","title":"CPU, datapath va bus","terms":["Processor","Bus","Data path","Register","ALU"],"theory":"CPU instruksiyalarni bajaradi, registrlar tezkor qiymatlarni saqlaydi, datapath esa ma’lumotning hisoblash bloklari orasidagi yo‘lidir. Bus turli komponentlar o‘rtasidagi aloqa. Go kodi ham mashina kodiga aylangach shu apparatda ishlaydi.","risk":"CPU ko‘p bo‘lsa dastur avtomatik tezlashmaydi: memory va contention to‘siq bo‘lishi mumkin.","drill":"runtime.NumCPU() va GOMAXPROCS farqini tekshiring.","examples":[{"name":"CPU va P ni ko‘rish","code":"// CPU, datapath va bus\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tfmt.Println(\"CPU:\", runtime.NumCPU())\n\tfmt.Println(\"GOMAXPROCS:\", runtime.GOMAXPROCS(0))\n}\n","expected":"Mashina imkoniyatiga bog‘liq sonlar","why":"NumCPU — mantiqiy CPUlar; GOMAXPROCS — Go kodiga ajratilgan parallel bajarilish limiti.","level":"Junior · Sodda"},{"name":"Bitta P bilan ikki goroutine","code":"// CPU, datapath va bus\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n\t\"sync\"\n)\n\nfunc main() {\n\truntime.GOMAXPROCS(1)\n\tvar wg sync.WaitGroup\n\tfor i:=0;i<2;i++ { wg.Add(1); go func(id int){ defer wg.Done(); fmt.Println(\"task\",id) }(i) }; wg.Wait()\n}\n","expected":"task 0 va task 1 (tartib ixtiyoriy)","why":"Concurrency bir dona Pda ham mavjud.","level":"Middle · Real holat"},{"name":"CPU-bound ishlarni bo‘lish","code":"// CPU, datapath va bus\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n\t\"sync\"\n)\n\nfunc main() {\n\truntime.GOMAXPROCS(2)\n\tvar wg sync.WaitGroup\n\tresults:=make([]int,2)\n\tfor w:=0;w<2;w++ { wg.Add(1); go func(w int){ defer wg.Done(); for i:=0;i<100000;i++ { results[w]+=i%7 } }(w) };wg.Wait();fmt.Println(results[0]+results[1])\n}\n","expected":"Ikkala hisob natijasining yig‘indisi","why":"Mustaqil slice indekslariga yozish mumkin, Wait natijani o‘qishdan avval synchronization beradi.","level":"Senior · Murakkab"}]},{"id":"m1-t2","title":"CPU pipeline va hyper-threading","terms":["Instruction pipeline","Hyper-threading","SMT","Moore law"],"theory":"Pipeline turli instruksiyalar bosqichlarini ustma-ust bajaradi. SMT/Hyper-threading bitta fizik yadro resurslaridan bir nechta apparat thread orqali foydalanadi. Moore qonuni tranzistor zichligiga oid tarixiy kuzatuv.","risk":"SMT oqimlari mustaqil fizik yadro emas; benchmarkni real muhitda qiling.","drill":"Bir yadro va ko‘p yadroda CPU-bound ish vaqtini solishtiring.","examples":[{"name":"Vaqt o‘lchash","code":"// CPU pipeline va hyper-threading\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tstart:=time.Now(); total:=0;for i:=0;i<100000;i++ { total+=i }; fmt.Println(total, time.Since(start))\n}\n","expected":"","why":"Vaqt muhitga bog‘liq; optimizatsiyada haqiqiy benchmark kerak.","level":"Junior · Sodda"},{"name":"Parallel sum","code":"// CPU pipeline va hyper-threading\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tnums:=make([]int,100000);for i:=range nums { nums[i]=i }\n\tstart:=time.Now();half:=len(nums)/2;result:=make(chan int,2)\n\tfor _,part:=range [][]int{nums[:half],nums[half:]} { go func(p []int){ s:=0;for _,n:=range p{s+=n};result<-s }(part) }\n\tfmt.Println(<-result+<-result, time.Since(start))\n}\n","expected":"","why":"Bo‘lib hisoblash overhead bilan keladi; kichik ishda sekinlashishi mumkin.","level":"Middle · Real holat"},{"name":"Benchmarkga tayyor test shabloni","code":"// CPU pipeline va hyper-threading\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tstart:=time.Now();var total atomic.Int64;var wg sync.WaitGroup\n\tfor w:=0;w<4;w++ { wg.Add(1);go func(){defer wg.Done();for i:=0;i<10000;i++ {total.Add(1)}}()};wg.Wait()\n\tfmt.Println(\"operations:\",total.Load(),\"elapsed:\",time.Since(start))\n}\n","expected":"operations: 40000","why":"Bu microbenchmark ko‘rinishi; real natija uchun go test -bench va pprof ishlating.","level":"Senior · Murakkab"}]},{"id":"m1-t3","title":"Vectorization va CPU samaradorligi","terms":["SIMD","Vectorization","Cache locality"],"theory":"SIMD bir instruksiyada ko‘p element bilan ishlash imkonini beradi. Ketma-ket xotira joylashuvi cache uchun qulay. Go kompilyatori har bir siklni avtomatik SIMDga aylantirmaydi.","risk":"Erta optimizatsiya emas, profiling va benchmark asosida optimizatsiya qiling.","drill":"Katta slice yig‘indisini va parallel bo‘lakli variantni solishtiring.","examples":[{"name":"Slice elementlari yig‘indisi","code":"// Vectorization va CPU samaradorligi\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tvalues:=[]int{2,4,6,8};sum:=0;for _,v:=range values {sum+=v};fmt.Println(sum)\n}\n","expected":"20","why":"Ketma-ket xotira cache locality uchun qulay.","level":"Junior · Sodda"},{"name":"Oldindan allocation","code":"// Vectorization va CPU samaradorligi\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tvalues:=make([]int,0,1000);for i:=0;i<1000;i++{values=append(values,i)};fmt.Println(len(values),cap(values))\n}\n","expected":"1000 1000","why":"Capacity oldindan berilsa qayta allocation kamayadi.","level":"Middle · Real holat"},{"name":"Bo‘laklarga parallel ishlov","code":"// Vectorization va CPU samaradorligi\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tvalues:=make([]int,10000);for i:=range values {values[i]=1};parts:=4;out:=make(chan int,parts)\n\tfor w:=0;w<parts;w++{a,b:=w*2500,(w+1)*2500;go func(){s:=0;for _,v:=range values[a:b]{s+=v};out<-s}()}\n\tsum:=0;for i:=0;i<parts;i++{sum+=<-out};fmt.Println(sum)\n}\n","expected":"10000","why":"Har worker alohida index intervalini o‘qiydi; faqat natija birlashtiriladi.","level":"Senior · Murakkab"}]},{"id":"m1-t4","title":"Virtual memory, MMU, TLB","terms":["Virtual Memory","MMU","TLB","Page table"],"theory":"Process virtual manzillar bilan ishlaydi, MMU ularni fizik xotiraga tarjima qiladi; TLB tarjimalarni cache qiladi. Stack va heapdagi qiymatlarning virtual manzillari bor.","risk":"TLB yoki OS sahifalarini oddiy Go kodidan to‘g‘ridan-to‘g‘ri boshqarmaysiz.","drill":"Ko‘p kichik allocation va oldindan allocation vaqtini o‘lchang.","examples":[{"name":"Heap allocate va pointer","code":"// Virtual memory, MMU, TLB\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tv:=new(int);*v=42;fmt.Println(*v)\n}\n","expected":"42","why":"new(int) pointer qaytaradi, lekin heap/stack qarorini escape analysis beradi.","level":"Junior · Sodda"},{"name":"GC statistikasini o‘qish","code":"// Virtual memory, MMU, TLB\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tvar m runtime.MemStats;runtime.ReadMemStats(&m);fmt.Println(\"allocated bytes:\",m.Alloc)\n}\n","expected":"Joriy heap qiymati","why":"MemStats tizim xotirasi haqidagi ko‘plab ko‘rsatkichlardan biridir.","level":"Middle · Real holat"},{"name":"Allocationni qayta ishlatish","code":"// Virtual memory, MMU, TLB\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tbuf:=make([]byte,0,1024);for i:=0;i<3;i++ {buf=buf[:0];buf=append(buf,[]byte(\"request\")...);fmt.Println(len(buf),cap(buf))}\n}\n","expected":"7 1024 (3 marta)","why":"Reusable buffer GC bosimini kamaytirishi mumkin; umumiy bufni parallel ulashmang.","level":"Senior · Murakkab"}]},{"id":"m1-t5","title":"Process memory va swapping","terms":["Process memory layout","Stack","Heap","Swapping","Garbage collector"],"theory":"Processda code, data, heap va stack kabi hududlar mavjud. Go goroutine stacki o‘suvchi, heap esa GC tomonidan boshqariladi. Swapping xotira bosimida diskni jalb qilib keskin sekinlashishi mumkin.","risk":"Stack/heap tanlovi har doim o‘zgaruvchi nomi yoki new ishlatilishiga bog‘liq emas; escape analysis hal qiladi.","drill":"go build -gcflags=-m orqali escape analysisni ko‘ring.","examples":[{"name":"Heap allocate va pointer","code":"// Process memory va swapping\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tv:=new(int);*v=42;fmt.Println(*v)\n}\n","expected":"42","why":"new(int) pointer qaytaradi, lekin heap/stack qarorini escape analysis beradi.","level":"Junior · Sodda"},{"name":"GC statistikasini o‘qish","code":"// Process memory va swapping\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tvar m runtime.MemStats;runtime.ReadMemStats(&m);fmt.Println(\"allocated bytes:\",m.Alloc)\n}\n","expected":"Joriy heap qiymati","why":"MemStats tizim xotirasi haqidagi ko‘plab ko‘rsatkichlardan biridir.","level":"Middle · Real holat"},{"name":"Allocationni qayta ishlatish","code":"// Process memory va swapping\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tbuf:=make([]byte,0,1024);for i:=0;i<3;i++ {buf=buf[:0];buf=append(buf,[]byte(\"request\")...);fmt.Println(len(buf),cap(buf))}\n}\n","expected":"7 1024 (3 marta)","why":"Reusable buffer GC bosimini kamaytirishi mumkin; umumiy bufni parallel ulashmang.","level":"Senior · Murakkab"}]},{"id":"m1-t6","title":"Process, thread, interrupt","terms":["Process","OS thread","Interrupt","Context switch"],"theory":"Process alohida manzil makoniga, thread esa OS scheduler boshqaradigan bajarilish oqimiga ega. Interrupt muhim tashqi/ichki hodisalarni CPUga bildiradi. Context switch bajarilish holatini almashtirishni talab etadi.","risk":"Har goroutine uchun alohida OS thread yaratilmaydi.","drill":"Goroutine va OS thread soni bir xil emasligini izohlang.","examples":[{"name":"Bitta goroutine","code":"// Process, thread, interrupt\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});go func(){fmt.Println(\"worker tugadi\");close(done)}();<-done\n}\n","expected":"worker tugadi","why":"main worker tugashini kanal orqali kutyapti.","level":"Junior · Sodda"},{"name":"WaitGroup bilan parallel ish","code":"// Process, thread, interrupt\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup;for i:=1;i<=3;i++{wg.Add(1);go func(id int){defer wg.Done();fmt.Println(\"job\",id)}(i)};wg.Wait()\n}\n","expected":"1,2,3 har xil tartibda","why":"Goroutine yakunlanishi tegishli synchronization bilan kuzatiladi.","level":"Middle · Real holat"},{"name":"Nazoratli 3 worker","code":"// Process, thread, interrupt\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tjobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<3;w++{wg.Add(1);go func(){defer wg.Done();for j:=range jobs{fmt.Println(\"work\",j)}}()}\n\tfor i:=0;i<9;i++{jobs<-i};close(jobs);wg.Wait()\n}\n","expected":"9 ta work bajariladi","why":"Cheklangan worker soni tizimga yuboriladigan parallel ishni nazorat qiladi.","level":"Senior · Murakkab"}]},{"id":"m1-t7","title":"Concurrency va parallelism","terms":["Concurrency","Parallelism","Cooperative multitasking","Preemptive multitasking","Coroutine","Fiber","Green thread"],"theory":"Concurrency bir nechta vazifaning oldinga siljishidir, parallelism esa bir vaqtning o‘zida bajarilish. Runtime va OS turli darajadagi scheduling ishlatadi. Coroutine, fiber, goroutine atamalari o‘xshash, lekin ichki ishlashi turlicha.","risk":"Concurrency har doim tezlikni oshirmaydi; I/O va CPU ishlarining farqini biling.","drill":"GOMAXPROCS(1) holatida ham concurrency mavjudligini namoyish qiling.","examples":[{"name":"Bitta goroutine","code":"// Concurrency va parallelism\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});go func(){fmt.Println(\"worker tugadi\");close(done)}();<-done\n}\n","expected":"worker tugadi","why":"main worker tugashini kanal orqali kutyapti.","level":"Junior · Sodda"},{"name":"WaitGroup bilan parallel ish","code":"// Concurrency va parallelism\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup;for i:=1;i<=3;i++{wg.Add(1);go func(id int){defer wg.Done();fmt.Println(\"job\",id)}(i)};wg.Wait()\n}\n","expected":"1,2,3 har xil tartibda","why":"Goroutine yakunlanishi tegishli synchronization bilan kuzatiladi.","level":"Middle · Real holat"},{"name":"Nazoratli 3 worker","code":"// Concurrency va parallelism\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tjobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<3;w++{wg.Add(1);go func(){defer wg.Done();for j:=range jobs{fmt.Println(\"work\",j)}}()}\n\tfor i:=0;i<9;i++{jobs<-i};close(jobs);wg.Wait()\n}\n","expected":"9 ta work bajariladi","why":"Cheklangan worker soni tizimga yuboriladigan parallel ishni nazorat qiladi.","level":"Senior · Murakkab"}]},{"id":"m1-t8","title":"CPU cache va MESI","terms":["CPU caches","Cache line","MESI","Cache coherence"],"theory":"Bir nechta yadro umumiy xotiraning nusxalarini cacheda ushlashi mumkin. MESI singari coherence protokollari cache line holatlarini muvofiqlashtiradi. Bitta cache line ustidagi raqobat latency va throughputga ta’sir qiladi.","risk":"False sharingni `sync.Mutex` bilan adashtirmang: bu fizik cache line raqobati.","drill":"Bir umumiy va alohida counterlar benchmarkini yozing.","examples":[{"name":"Atomic counter","code":"// CPU cache va MESI\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar a atomic.Int64;a.Add(1);a.Add(2);fmt.Println(a.Load())\n}\n","expected":"3","why":"Add va Load race-free.","level":"Junior · Sodda"},{"name":"CAS status transition","code":"// CPU cache va MESI\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar state atomic.Int32;ok:=state.CompareAndSwap(0,1);again:=state.CompareAndSwap(0,1);fmt.Println(ok,again,state.Load())\n}\n","expected":"true false 1","why":"Birgina goroutine transitionni muvaffaqiyatli amalga oshiradi.","level":"Middle · Real holat"},{"name":"Atomic snapshot","code":"// CPU cache va MESI\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Config struct{Limit int};var p atomic.Pointer[Config];p.Store(&Config{Limit:50});var wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(p.Load().Limit)}()};wg.Wait();p.Store(&Config{Limit:100});fmt.Println(\"new\",p.Load().Limit)\n}\n","expected":"50 va new 100","why":"Yangi immutable configni to‘liq yaratib, pointerga publish qiling.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"Concurrency har doim parallel bajarilishmi?","options":["Ha","Yo‘q, bitta core ham bo‘lishi mumkin","Faqat 8 core bo‘lsa"],"correct":1,"reason":"Concurrency — bir nechta ishning progressi; parallelism aynan bir vaqtda bajarilish."},{"q":"TLB nima?","options":["Virtual→physical mapping cache","Goroutine queue","Disk file"],"correct":0,"reason":"TLB MMU address translationni tezlashtiradi."},{"q":"SMT = ikkita fizik coremi?","options":["Ha","Yo‘q","Go package"],"correct":1,"reason":"Bitta core hardware oqimlar bilan resursni ulashadi."}]},{"id":"m2","num":2,"title":"Goroutine va Go scheduler","summary":"GMP, local/global queue, sysmon va netpoller.","goal":"Go runtime ishlarni M/P/G orqali qanday rejalashtirishini anglash.","homework":"Parser va DB qatlamlarini davom ettirish.","topics":[{"id":"m2-t1","title":"Goroutine, state va context switch","terms":["Goroutine","State","Runnable","Running","Waiting","Goroutine context switching"],"theory":"Goroutine Go runtime boshqaradigan yengil bajarilish birligi. Uning stacki, bajarilish holati va scheduler metama’lumotlari bo‘ladi. Context switchingda runtime boshqa Gni ijroga tanlaydi.","risk":"Goroutine scheduling tartibiga tayanib biznes logika yozmang.","drill":"100 ta goroutine ishni tugatishini WaitGroup bilan tekshiring.","examples":[{"name":"Bitta goroutine","code":"// Goroutine, state va context switch\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});go func(){fmt.Println(\"worker tugadi\");close(done)}();<-done\n}\n","expected":"worker tugadi","why":"main worker tugashini kanal orqali kutyapti.","level":"Junior · Sodda"},{"name":"WaitGroup bilan parallel ish","code":"// Goroutine, state va context switch\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup;for i:=1;i<=3;i++{wg.Add(1);go func(id int){defer wg.Done();fmt.Println(\"job\",id)}(i)};wg.Wait()\n}\n","expected":"1,2,3 har xil tartibda","why":"Goroutine yakunlanishi tegishli synchronization bilan kuzatiladi.","level":"Middle · Real holat"},{"name":"Nazoratli 3 worker","code":"// Goroutine, state va context switch\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tjobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<3;w++{wg.Add(1);go func(){defer wg.Done();for j:=range jobs{fmt.Println(\"work\",j)}}()}\n\tfor i:=0;i<9;i++{jobs<-i};close(jobs);wg.Wait()\n}\n","expected":"9 ta work bajariladi","why":"Cheklangan worker soni tizimga yuboriladigan parallel ishni nazorat qiladi.","level":"Senior · Murakkab"}]},{"id":"m2-t2","title":"Goroutine stack o‘sishi","terms":["Contiguous stack","Segmented stack","Stack growth"],"theory":"Zamonaviy Go stacki zaruratga qarab kengayadi; eski segmented stack usuli tarixiy qiziqish uchun muhim. Rekursiya va katta local qiymatlar stack ehtiyojini oshiradi.","risk":"Stack o‘sishi bepul emas; cheksiz rekursiya xavfli.","drill":"Rekursiv funksiyani va iterativ alternativani solishtiring.","examples":[{"name":"Rekursiv factorial","code":"// Goroutine stack o‘sishi\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar f func(int) int;f=func(n int) int {if n<=1{return 1};return n*f(n-1)};fmt.Println(f(5))\n}\n","expected":"120","why":"Har rekursiv chaqiriq stack frame talab qiladi.","level":"Junior · Sodda"},{"name":"Iterativ alternativa","code":"// Goroutine stack o‘sishi\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tf:=func(n int) int {ans:=1;for i:=2;i<=n;i++{ans*=i};return ans};fmt.Println(f(5))\n}\n","expected":"120","why":"Iterativ kod chuqur rekursiya riskidan qochishi mumkin.","level":"Middle · Real holat"},{"name":"Rekursiya bilan tree walk","code":"// Goroutine stack o‘sishi\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Node struct{V int;Children []*Node};root:=&Node{V:1,Children:[]*Node{{V:2},{V:3}}}\n\tvar sum func(*Node)int;sum=func(n *Node)int{v:=n.V;for _,child:=range n.Children{v+=sum(child)};return v};fmt.Println(sum(root))\n}\n","expected":"6","why":"Katta depth bo‘lsa stack o‘sadi; depth limit yoki iterativ traversal o‘ylang.","level":"Senior · Murakkab"}]},{"id":"m2-t3","title":"Panic, recover va goroutine life cycle","terms":["Panic","Recover","Defer","runtime.Goexit"],"theory":"recover faqat o‘sha goroutine stackidagi defer ichida ishlaydi. Goexit goroutineni yakunlaydi va deferlarni bajaradi, boshqadagi panicni ushlamaydi.","risk":"HTTP middleware ichidagi recover boshqa goroutinedagi panicni ushlamaydi.","drill":"Worker ichida recover va error kanalini tashkil qiling.","examples":[{"name":"Panicni ushlash","code":"// Panic, recover va goroutine life cycle\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tfunc(){defer func(){if p:=recover();p!=nil{fmt.Println(\"recovered\",p)}}();panic(\"oops\")}()\n}\n","expected":"recovered oops","why":"recover faqat deferred funksiya ichida ishlaydi.","level":"Junior · Sodda"},{"name":"Goroutine ichida alohida recover","code":"// Panic, recover va goroutine life cycle\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});go func(){defer close(done);defer func(){if p:=recover();p!=nil{fmt.Println(\"worker panic\",p)}}();panic(\"bad job\")}();<-done\n}\n","expected":"worker panic bad job","why":"Boshqa goroutinadagi recover bu panicni ushlay olmaydi.","level":"Middle · Real holat"},{"name":"Worker errorga aylantirish","code":"// Panic, recover va goroutine life cycle\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\terrors:=make(chan error,1);go func(){defer close(errors);defer func(){if p:=recover();p!=nil{errors<-fmt.Errorf(\"panic: %v\",p)}}();panic(\"bad input\")}();fmt.Println(<-errors)\n}\n","expected":"panic: bad input","why":"Panicni faqat chegara nuqtada recovery qiling; oddiy xato uchun error qaytaring.","level":"Senior · Murakkab"}]},{"id":"m2-t4","title":"GMP scheduler modeli","terms":["G","M","P","GOMAXPROCS","Scheduler"],"theory":"G — goroutine, M — OS thread, P — Go kodini bajarish uchun runtime konteksti. GOMAXPROCS faol P sonini boshqaradi. Bitta M uzoq syscall bilan band bo‘lsa P boshqa Mga o‘tishi mumkin.","risk":"GOMAXPROCS goroutine sonini cheklamaydi.","drill":"CPU-bound ishni GOMAXPROCS bilan o‘lchang.","examples":[{"name":"CPU va P ni ko‘rish","code":"// GMP scheduler modeli\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tfmt.Println(\"CPU:\", runtime.NumCPU())\n\tfmt.Println(\"GOMAXPROCS:\", runtime.GOMAXPROCS(0))\n}\n","expected":"Mashina imkoniyatiga bog‘liq sonlar","why":"NumCPU — mantiqiy CPUlar; GOMAXPROCS — Go kodiga ajratilgan parallel bajarilish limiti.","level":"Junior · Sodda"},{"name":"Bitta P bilan ikki goroutine","code":"// GMP scheduler modeli\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n\t\"sync\"\n)\n\nfunc main() {\n\truntime.GOMAXPROCS(1)\n\tvar wg sync.WaitGroup\n\tfor i:=0;i<2;i++ { wg.Add(1); go func(id int){ defer wg.Done(); fmt.Println(\"task\",id) }(i) }; wg.Wait()\n}\n","expected":"task 0 va task 1 (tartib ixtiyoriy)","why":"Concurrency bir dona Pda ham mavjud.","level":"Middle · Real holat"},{"name":"CPU-bound ishlarni bo‘lish","code":"// GMP scheduler modeli\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n\t\"sync\"\n)\n\nfunc main() {\n\truntime.GOMAXPROCS(2)\n\tvar wg sync.WaitGroup\n\tresults:=make([]int,2)\n\tfor w:=0;w<2;w++ { wg.Add(1); go func(w int){ defer wg.Done(); for i:=0;i<100000;i++ { results[w]+=i%7 } }(w) };wg.Wait();fmt.Println(results[0]+results[1])\n}\n","expected":"Ikkala hisob natijasining yig‘indisi","why":"Mustaqil slice indekslariga yozish mumkin, Wait natijani o‘qishdan avval synchronization beradi.","level":"Senior · Murakkab"}]},{"id":"m2-t5","title":"Local/global queues va work stealing","terms":["LRQ","GRQ","Local queue","Global queue","Work stealing","Work sharing"],"theory":"Har Pda local runnable queue bor, global queue ham mavjud. Bekor P boshqa Pdan ishni olishi (work stealing) mumkin. Shunday qilib load taqsimlanadi.","risk":"Queue va scheduler tartibi Go versiyasiga qarab o‘zgarishi mumkin: ichki detallarga application invariant bog‘lamang.","drill":"Ko‘p qisqa vazifa uchun worker pool bilan solishtiring.","examples":[{"name":"Bitta goroutine","code":"// Local/global queues va work stealing\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});go func(){fmt.Println(\"worker tugadi\");close(done)}();<-done\n}\n","expected":"worker tugadi","why":"main worker tugashini kanal orqali kutyapti.","level":"Junior · Sodda"},{"name":"WaitGroup bilan parallel ish","code":"// Local/global queues va work stealing\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup;for i:=1;i<=3;i++{wg.Add(1);go func(id int){defer wg.Done();fmt.Println(\"job\",id)}(i)};wg.Wait()\n}\n","expected":"1,2,3 har xil tartibda","why":"Goroutine yakunlanishi tegishli synchronization bilan kuzatiladi.","level":"Middle · Real holat"},{"name":"Nazoratli 3 worker","code":"// Local/global queues va work stealing\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tjobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<3;w++{wg.Add(1);go func(){defer wg.Done();for j:=range jobs{fmt.Println(\"work\",j)}}()}\n\tfor i:=0;i<9;i++{jobs<-i};close(jobs);wg.Wait()\n}\n","expected":"9 ta work bajariladi","why":"Cheklangan worker soni tizimga yuboriladigan parallel ishni nazorat qiladi.","level":"Senior · Murakkab"}]},{"id":"m2-t6","title":"Sysmon, netpoller va handoff","terms":["Sysmon","Netpoller","Handoff","Async preemption","Network I/O"],"theory":"Netpoller socket tayyor bo‘lishini kuzatib kutayotgan Gni qayta uyg‘otadi. Sysmon runtime housekeeping, uzoq ishlayotgan G va boshqa vaziyatlarga xizmat qiladi. Handoff Pni boshqa M ga topshirish bilan bog‘liq.","risk":"time.Sleep vaqt kutish, syscall, netpoll va CPU-loop scheduling xatti-harakati turlicha.","drill":"Tarmoq requestni context timeout bilan bog‘lang.","examples":[{"name":"net.Pipe bilan aloqa","code":"// Sysmon, netpoller va handoff\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net\"\n)\n\nfunc main() {\n\ta,b:=net.Pipe();defer a.Close();defer b.Close();go func(){fmt.Fprintln(a,\"PING\")}();var msg string;fmt.Fscanln(b,&msg);fmt.Println(msg)\n}\n","expected":"PING","why":"net.Pipe tarmoq socketi ochmasdan ikki ulanishni simulyatsiya qiladi.","level":"Junior · Sodda"},{"name":"Local HTTP serverga so‘rov","code":"// Sysmon, netpoller va handoff\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"io\"\n)\n\nfunc main() {\n\tserver:=httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter,r *http.Request){fmt.Fprint(w,\"ok\")}));defer server.Close()\n\tresp,err:=http.Get(server.URL);if err!=nil{panic(err)};defer resp.Body.Close();data,_:=io.ReadAll(resp.Body);fmt.Println(string(data))\n}\n","expected":"ok","why":"Netpoller haqidagi tushunchalarni real HTTP IO bilan bog‘lang.","level":"Middle · Real holat"},{"name":"Timeout bilan HTTP client","code":"// Sysmon, netpoller va handoff\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"time\"\n)\n\nfunc main() {\n\ts:=httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter,r *http.Request){time.Sleep(100*time.Millisecond);fmt.Fprint(w,\"late\")}));defer s.Close()\n\tclient:=&http.Client{Timeout:20*time.Millisecond};_,err:=client.Get(s.URL);fmt.Println(\"timeout?\",err!=nil)\n}\n","expected":"timeout? true","why":"Tarmoq operatsiyalarida timeout va context resource budgetni boshqaradi.","level":"Senior · Murakkab"}]},{"id":"m2-t7","title":"Runtime scheduling API","terms":["runtime.Gosched","runtime.Goexit","runtime.LockOSThread","runtime.GOMAXPROCS"],"theory":"Gosched joriy Gning bajarilishini ixtiyoriy bo‘shatadi, Goexit shu Gni yakunlaydi, LockOSThread ayni OS threadga bog‘laydi. Oddiy backendda odatda ular kerak bo‘lmaydi.","risk":"Goschedni lock yoki channel o‘rniga ishlatmang; LockOSThreadni asossiz qo‘llamang.","drill":"LockOSThreadga ehtiyoj bor va yo‘q holatlar haqida yozing.","examples":[{"name":"Gosched signal","code":"// Runtime scheduling API\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\truntime.Gosched();fmt.Println(\"schedulerga imkon berildi\")\n}\n","expected":"schedulerga imkon berildi","why":"Gosched concurrency primitive emas.","level":"Junior · Sodda"},{"name":"Goexit faqat goroutineni tugatadi","code":"// Runtime scheduling API\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});go func(){defer close(done);defer fmt.Println(\"defer bajarildi\");runtime.Goexit()}();<-done\n}\n","expected":"defer bajarildi","why":"Goexit joriy Gni yakunlab deferlarni bajaradi.","level":"Middle · Real holat"},{"name":"OSThreadga bog‘lash","code":"// Runtime scheduling API\npackage main\n\nimport (\n\t\"fmt\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});go func(){defer close(done);runtime.LockOSThread();defer runtime.UnlockOSThread();fmt.Println(\"shu OS threadga bog‘landi\")}();<-done\n}\n","expected":"shu OS threadga bog‘landi","why":"Faqat thread-affinity talab qiladigan maxsus holatlarda kerak.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"GMPda P nimani anglatadi?","options":["PostgreSQL","Runtime processor context","Process ID"],"correct":1,"reason":"P Go ishini bajarish uchun runtime resurslarini tutadi."},{"q":"GOMAXPROCS goroutine soninimi cheklaydi?","options":["Ha","Yo‘q","Faqat network uchun"],"correct":1,"reason":"U P soni bilan bog‘liq."},{"q":"Netpoller nima?","options":["Socket readiness","SQL query","Heap collector"],"correct":0,"reason":"Netpoller I/O tayyorligini kuzatadi."}]},{"id":"m3","num":3,"title":"Sinxronlash: asosiy vositalar","summary":"WaitGroup, Mutex, Once, data race va deadlock.","goal":"Umumiy mutable state bilan xavfsiz ishlash.","homework":"TCP server, CLI client va minimal matn protokoli.","topics":[{"id":"m3-t1","title":"WaitGroup va ish tugashini kutish","terms":["sync.WaitGroup","Add","Done","Wait"],"theory":"WaitGroup goroutinelar tugashini kutadi. Add(1) ish boshlanishidan oldin, Done() tugaganda, Wait() barcha ishlarni kutish uchun ishlatiladi. Yangi Go versiyalarida WaitGroup.Go ham bor.","risk":"Add va Wait noto‘g‘ri tartibda chaqirilsa ishlar to‘liq kutilmasligi mumkin.","drill":"100 ta ishni bo‘lib bajarib, hammasini kuting.","examples":[{"name":"Ikki ishni kutish","code":"// WaitGroup va ish tugashini kutish\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup;wg.Add(2);for i:=0;i<2;i++{go func(id int){defer wg.Done();fmt.Println(id)}(i)};wg.Wait()\n}\n","expected":"0 va 1","why":"Add ishlash boshlanishidan avval bajariladi.","level":"Junior · Sodda"},{"name":"Natijalarni indeksga yozish","code":"// WaitGroup va ish tugashini kutish\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tout:=make([]int,4);var wg sync.WaitGroup;for i:=range out{wg.Add(1);go func(i int){defer wg.Done();out[i]=i*i}(i)};wg.Wait();fmt.Println(out)\n}\n","expected":"[0 1 4 9]","why":"Har biri turli indeksga yozadi, Wait keyingi o‘qish bilan tartibni ta’minlaydi.","level":"Middle · Real holat"},{"name":"Contextli fan-out va WaitGroup","code":"// WaitGroup va ish tugashini kutish\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),100*time.Millisecond);defer cancel()\n\tvar wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(i int){defer wg.Done();select{case <-time.After(10*time.Millisecond):fmt.Println(\"done\",i);case <-ctx.Done():fmt.Println(\"cancel\",i)}}(i)};wg.Wait()\n}\n","expected":"done x (3 marta)","why":"WaitGroup tugashini kutadi, context esa to‘xtatish so‘rovini yuboradi.","level":"Senior · Murakkab"}]},{"id":"m3-t2","title":"Mutex va critical section","terms":["sync.Mutex","Lock","Unlock","Critical section"],"theory":"Mutex bir vaqtning o‘zida faqat bitta goroutinega himoyalangan hududga kirishga imkon beradi. `value++` atomik emas va himoyasiz race tug‘diradi.","risk":"Mutexni ishlatilgandan keyin nusxalamang; Lockni olgan yo‘llarda Unlock kafolatlanishi kerak.","drill":"Counter Get/Add metodlarini race-free qiling.","examples":[{"name":"Mutex bilan counter","code":"// Mutex va critical section\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;n:=0;mu.Lock();n++;mu.Unlock();fmt.Println(n)\n}\n","expected":"1","why":"Lock ostidagi critical section ketma-ket bajariladi.","level":"Junior · Sodda"},{"name":"1000 goroutine counter","code":"// Mutex va critical section\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;var wg sync.WaitGroup;n:=0;for i:=0;i<1000;i++{wg.Add(1);go func(){defer wg.Done();mu.Lock();n++;mu.Unlock()}()};wg.Wait();fmt.Println(n)\n}\n","expected":"1000","why":"Mu.Lock yozishni race-free qiladi.","level":"Middle · Real holat"},{"name":"Struct ichida mutex","code":"// Mutex va critical section\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype Counter struct { mu sync.Mutex; n int }\nfunc (c *Counter) Add(){c.mu.Lock();defer c.mu.Unlock();c.n++}\nfunc (c *Counter) Get()int{c.mu.Lock();defer c.mu.Unlock();return c.n}\n\nfunc main() {\n\tc:=&Counter{};var wg sync.WaitGroup;for i:=0;i<100;i++{wg.Add(1);go func(){defer wg.Done();c.Add()}()};wg.Wait();fmt.Println(c.Get())\n}\n","expected":"100","why":"Metodlar bir xil muhim fieldni bitta mutex bilan himoyalaydi.","level":"Senior · Murakkab"}]},{"id":"m3-t3","title":"Once va xavfsiz initialization","terms":["sync.Once","Singleton","Lazy init"],"theory":"Once bir funksiyani bir marta bajarishni ta’minlaydi. Concurrent konfiguratsiya va qimmat obyektni lazy yaratishda ishlatiladi. Panic qilgan funksiya ham chaqirilgan deb hisoblanadi.","risk":"Global singleton test va lifecycle boshqaruvini qiyinlashtirishi mumkin.","drill":"Bir nechta worker bitta configni yaratishini ta’minlang.","examples":[{"name":"Once faqat bir marta","code":"// Once va xavfsiz initialization\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar once sync.Once;for i:=0;i<3;i++{once.Do(func(){fmt.Println(\"init\")})}\n}\n","expected":"init (bir marta)","why":"Bir necha Do bo‘lsa ham birinchi funksiya bitta marta.","level":"Junior · Sodda"},{"name":"Parallel lazy init","code":"// Once va xavfsiz initialization\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar once sync.Once;var wg sync.WaitGroup;count:=0;for i:=0;i<10;i++{wg.Add(1);go func(){defer wg.Done();once.Do(func(){count=42})}()};wg.Wait();fmt.Println(count)\n}\n","expected":"42","why":"Do tugaganidan so‘ng other callers natijani ko‘radi.","level":"Middle · Real holat"},{"name":"Config lazy loader","code":"// Once va xavfsiz initialization\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype Config struct{ once sync.Once; value string }\nfunc(c *Config)Get()string{c.once.Do(func(){c.value=\"ready\"});return c.value}\n\nfunc main() {\n\tc:=&Config{};var wg sync.WaitGroup;for i:=0;i<4;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(c.Get())}()};wg.Wait()\n}\n","expected":"ready (4 marta)","why":"Once struct ichida config initializationni himoyalaydi.","level":"Senior · Murakkab"}]},{"id":"m3-t4","title":"Data race, race detector","terms":["Data race","Go race detector","Happens-before"],"theory":"Bir xotira manzilida sinxronlashmagan read/write race paydo qiladi. `go test -race ./...` ishlagan test yo‘llaridagi raceni aniqlaydi. Mutex, channel va atomic sinxronlash imkonini beradi.","risk":"-race barcha mumkin bo‘lgan xatolarni topmaydi va deadlock detector emas.","drill":"Go testga `-race` qo‘shing, lockni olib tashlab farqini kuzating.","examples":[{"name":"Mutex bilan counter","code":"// Data race, race detector\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;n:=0;mu.Lock();n++;mu.Unlock();fmt.Println(n)\n}\n","expected":"1","why":"Lock ostidagi critical section ketma-ket bajariladi.","level":"Junior · Sodda"},{"name":"1000 goroutine counter","code":"// Data race, race detector\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;var wg sync.WaitGroup;n:=0;for i:=0;i<1000;i++{wg.Add(1);go func(){defer wg.Done();mu.Lock();n++;mu.Unlock()}()};wg.Wait();fmt.Println(n)\n}\n","expected":"1000","why":"Mu.Lock yozishni race-free qiladi.","level":"Middle · Real holat"},{"name":"Struct ichida mutex","code":"// Data race, race detector\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype Counter struct { mu sync.Mutex; n int }\nfunc (c *Counter) Add(){c.mu.Lock();defer c.mu.Unlock();c.n++}\nfunc (c *Counter) Get()int{c.mu.Lock();defer c.mu.Unlock();return c.n}\n\nfunc main() {\n\tc:=&Counter{};var wg sync.WaitGroup;for i:=0;i<100;i++{wg.Add(1);go func(){defer wg.Done();c.Add()}()};wg.Wait();fmt.Println(c.Get())\n}\n","expected":"100","why":"Metodlar bir xil muhim fieldni bitta mutex bilan himoyalaydi.","level":"Senior · Murakkab"}]},{"id":"m3-t5","title":"Deadlock va recursive locking","terms":["Deadlock","Recursive mutex","Lock order","Holt graph"],"theory":"Deadlockda goroutinelar zarur resurslarni o‘zaro kutib qoladi. Bir xil non-recursive mutexni ikki marta olish ham deadlockga sabab bo‘lishi mumkin. Holt grafigi resurs kutish siklini ko‘rsatadi.","risk":"Lock orderni barcha kod yo‘llarida barqaror saqlang.","drill":"Ikki lockni A→B va B→A tartibida olish nimaga xavfli ekanini tahlil qiling.","examples":[{"name":"Noto‘g‘ri lockni anglash","code":"// Deadlock va recursive locking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;mu.Lock();fmt.Println(\"critical\");mu.Unlock()\n\t// mu.Lock(); mu.Lock() => ikkinchisi deadlock: QILMANG\n}\n","expected":"critical","why":"Mutex reentrant emas; qayta Lock qilmaslik kerak.","level":"Junior · Sodda"},{"name":"Lock orderni bir xil saqlash","code":"// Deadlock va recursive locking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar a,b sync.Mutex;lockBoth:=func(){a.Lock();b.Lock();defer b.Unlock();defer a.Unlock();fmt.Println(\"locked\")};lockBoth()\n}\n","expected":"locked","why":"Hamma joyda A→B tartibi siklli kutishni kamaytiradi.","level":"Middle · Real holat"},{"name":"Timeoutli koordinatsiya","code":"// Deadlock va recursive locking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),30*time.Millisecond);defer cancel()\n\tch:=make(chan int);select{case ch<-1:fmt.Println(\"sent\");case <-ctx.Done():fmt.Println(\"send cancelled\")}\n}\n","expected":"send cancelled","why":"Channel operatsiyalarida cancellation deadlockga o‘xshash abadiy kutishni oldini oladi.","level":"Senior · Murakkab"}]},{"id":"m3-t6","title":"Livelock, starvation, priority inversion","terms":["Livelock","Starvation","Priority inversion","Normal/starvation mutex mode","Wait queue"],"theory":"Livelockda ishchilar harakat qiladi, lekin natija yo‘q. Starvationda ayrim ishchilar uzoq kutadi. Priority inversion past prioritetli egadagi resursni yuqori prioritetli ish kutishidir. Go mutexida contentionga qarab normal/starvation rejimlari bo‘lishi mumkin.","risk":"Har bir uzluksiz loop livelock emas; foydali progressni o‘lchang.","drill":"Fairness va throughputni real o‘lchov bilan solishtiring.","examples":[{"name":"Queue navbatini anglash","code":"// Livelock, starvation, priority inversion\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tqueue:=[]string{\"A\",\"B\",\"C\"};for _,x:=range queue{fmt.Println(\"served\",x)}\n}\n","expected":"A, B, C","why":"Adolatli tartib va maksimal throughput bir xil maqsad emas.","level":"Junior · Sodda"},{"name":"Ishchi statistikasini yig‘ish","code":"// Livelock, starvation, priority inversion\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup;counts:=make([]int,3);for w:=0;w<3;w++{wg.Add(1);go func(w int){defer wg.Done();for i:=0;i<5;i++{counts[w]++}}(w)};wg.Wait();fmt.Println(counts)\n}\n","expected":"[5 5 5]","why":"Bu misolda ish teng taqsimlangan; haqiqiy fairness schedulingdan keladi.","level":"Middle · Real holat"},{"name":"Lock ushlab turish vaqtini kamaytirish","code":"// Livelock, starvation, priority inversion\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;total:=0;start:=time.Now();for i:=0;i<100;i++{v:=i*i;mu.Lock();total+=v;mu.Unlock()};fmt.Println(total,time.Since(start))\n}\n","expected":"","why":"Og‘ir hisob lock tashqarisida bajarildi, critical section qisqa.","level":"Senior · Murakkab"}]},{"id":"m3-t7","title":"Antipatternlar: local mutex, copy, defer","terms":["Local mutex","Copying synchronization primitives","defer pitfalls","Incorrect synchronized structure"],"theory":"Har request uchun yangi mutex yaratish umumiy mapni himoya qilmaydi. Mutexni nusxalash xato. `defer Unlock()` oddiy va xavfsiz, lekin uzun funksiyada lockni uzoq ushlashi mumkin.","risk":"RWMutex bilan himoyalangan fieldni gettersiz yoki locksiz o‘qish ham race.","drill":"Structning ichki mutexini pointer receiver orqali himoyalang.","examples":[{"name":"Mutex bilan counter","code":"// Antipatternlar: local mutex, copy, defer\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;n:=0;mu.Lock();n++;mu.Unlock();fmt.Println(n)\n}\n","expected":"1","why":"Lock ostidagi critical section ketma-ket bajariladi.","level":"Junior · Sodda"},{"name":"1000 goroutine counter","code":"// Antipatternlar: local mutex, copy, defer\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;var wg sync.WaitGroup;n:=0;for i:=0;i<1000;i++{wg.Add(1);go func(){defer wg.Done();mu.Lock();n++;mu.Unlock()}()};wg.Wait();fmt.Println(n)\n}\n","expected":"1000","why":"Mu.Lock yozishni race-free qiladi.","level":"Middle · Real holat"},{"name":"Struct ichida mutex","code":"// Antipatternlar: local mutex, copy, defer\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype Counter struct { mu sync.Mutex; n int }\nfunc (c *Counter) Add(){c.mu.Lock();defer c.mu.Unlock();c.n++}\nfunc (c *Counter) Get()int{c.mu.Lock();defer c.mu.Unlock();return c.n}\n\nfunc main() {\n\tc:=&Counter{};var wg sync.WaitGroup;for i:=0;i<100;i++{wg.Add(1);go func(){defer wg.Done();c.Add()}()};wg.Wait();fmt.Println(c.Get())\n}\n","expected":"100","why":"Metodlar bir xil muhim fieldni bitta mutex bilan himoyalaydi.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"Mutex nima qiladi?","options":["Bir vaqtda bitta critical section","100 worker yaratadi","Memory cache"],"correct":0,"reason":"Lock umumiy mutable state ustida eksklyuziv kirish beradi."},{"q":"WaitGroup nima kutadi?","options":["GC","Goroutine tugashini","Socket portini"],"correct":1,"reason":"Done counter nol bo‘lguncha Wait bloklanadi."},{"q":"Race detector nimani topadi?","options":["Hamma deadlockni","Ishlagan yo‘llardagi data raceni","SQL syntaxni"],"correct":1,"reason":"-race barcha schedule holatini kafolatlamaydi."}]},{"id":"m4","num":4,"title":"Sinxronlash: kengaytirilgan","summary":"RWMutex, atomic, Cond, Pool va custom locklar.","goal":"Contentionni kamaytirish va synchronization mexanizmlarini tanlash.","homework":"TCP/CLI protokoli va parallel ulanishlarni yakunlash.","topics":[{"id":"m4-t1","title":"RWMutex va read-heavy cache","terms":["sync.RWMutex","RLock","RUnlock","Writer"],"theory":"Ko‘p reader parallel o‘qishi, writer esa eksklyuziv yozishi mumkin. Read-heavy cache uchun qulay, lekin har doim oddiy Mutexdan tez emas. Benchmark bilan tekshiring.","risk":"Read lockni ushlab turib write lock olishga urinish deadlock qilishi mumkin.","drill":"10 ta reader va 1 writer qo‘shib benchmarklang.","examples":[{"name":"Read lock","code":"// RWMutex va read-heavy cache\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.RWMutex;n:=5;mu.RLock();fmt.Println(n);mu.RUnlock()\n}\n","expected":"5","why":"RLock o‘qishga ruxsat beradi.","level":"Junior · Sodda"},{"name":"Ko‘p reader","code":"// RWMutex va read-heavy cache\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.RWMutex;n:=42;var wg sync.WaitGroup;for i:=0;i<5;i++{wg.Add(1);go func(){defer wg.Done();mu.RLock();fmt.Println(n);mu.RUnlock()}()};wg.Wait()\n}\n","expected":"42 (5 marta)","why":"Readerlar o‘zaro to‘smasligi mumkin.","level":"Middle · Real holat"},{"name":"Read-heavy cache","code":"// RWMutex va read-heavy cache\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype SafeCache struct{mu sync.RWMutex;data map[string]string}\nfunc(c *SafeCache)Get(k string)string{c.mu.RLock();defer c.mu.RUnlock();return c.data[k]}\nfunc(c *SafeCache)Set(k,v string){c.mu.Lock();defer c.mu.Unlock();c.data[k]=v}\n\nfunc main() {\n\tc:=&SafeCache{data:map[string]string{}};c.Set(\"user:1\",\"Ali\");var wg sync.WaitGroup;for i:=0;i<10;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(c.Get(\"user:1\"))}()};wg.Wait()\n}\n","expected":"Ali (10 marta)","why":"Cache mapdan o‘qish RLock, yozish Lock ostida.","level":"Senior · Murakkab"}]},{"id":"m4-t2","title":"sync.Map va ichki tuzilish","terms":["sync.Map","Load","Store","LoadOrStore","Range"],"theory":"sync.Map concurrent foydalanish uchun tayyor map. Ayrim read-heavy yoki har xil keylar mustaqil yoziladigan holatlarda qulay. Oddiy `map + RWMutex` ko‘pincha ravshanroq.","risk":"Range bir xil snapshotni kafolatlamaydi, har vaziyatda sync.Map tanlamang.","drill":"LoadOrStore bilan parallel singleton per key qiling.","examples":[{"name":"Load va Store","code":"// sync.Map va ichki tuzilish\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar m sync.Map;m.Store(\"x\",10);v,ok:=m.Load(\"x\");fmt.Println(v,ok)\n}\n","expected":"10 true","why":"Map concurrent foydalanish uchun tayyor.","level":"Junior · Sodda"},{"name":"LoadOrStore","code":"// sync.Map va ichki tuzilish\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar m sync.Map;v,loaded:=m.LoadOrStore(\"config\",\"ready\");fmt.Println(v,loaded)\n}\n","expected":"ready false","why":"Birinchi chaqiriq keyni yaratadi.","level":"Middle · Real holat"},{"name":"Concurrent counter per key","code":"// sync.Map va ichki tuzilish\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar m sync.Map;var wg sync.WaitGroup;for i:=0;i<100;i++{wg.Add(1);go func(){defer wg.Done();v,_:=m.LoadOrStore(\"hits\",new(atomic.Int64));v.(*atomic.Int64).Add(1)}()};wg.Wait();v,_:=m.Load(\"hits\");fmt.Println(v.(*atomic.Int64).Load())\n}\n","expected":"100","why":"LoadOrStore bitta atomic counter instanceni umumiy qiladi.","level":"Senior · Murakkab"}]},{"id":"m4-t3","title":"sync.Cond va spurious wakeup","terms":["sync.Cond","Wait","Signal","Broadcast","Spurious wakeup"],"theory":"Cond ma’lum predicate bajarilguncha kutuvchilarni uyg‘otishga yordam beradi. `Wait()` lockni vaqtincha bo‘shatib, qayta oladi. Predicate har uyg‘onishda `for` bilan tekshiriladi.","risk":"Go Cond.Wait hujjatiga ko‘ra spurious return qilmaydi, lekin shartni baribir siklda tekshirish shart.","drill":"Queue bo‘sh bo‘lganda consumer kutadigan qiling.","examples":[{"name":"Shart bajarilguncha kutish","code":"// sync.Cond va spurious wakeup\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tmu:=&sync.Mutex{};cond:=sync.NewCond(mu);ready:=false;done:=make(chan struct{})\n\tgo func(){mu.Lock();for !ready{cond.Wait()};mu.Unlock();close(done)}();mu.Lock();ready=true;cond.Signal();mu.Unlock();<-done;fmt.Println(\"ready\")\n}\n","expected":"ready","why":"Cond.Wait predicate ustidan for bilan tekshiriladi.","level":"Junior · Sodda"},{"name":"2 kutuvchini uyg‘otish","code":"// sync.Cond va spurious wakeup\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tmu:=&sync.Mutex{};c:=sync.NewCond(mu);ready:=false;var wg sync.WaitGroup;for i:=0;i<2;i++{wg.Add(1);go func(){defer wg.Done();mu.Lock();for !ready{c.Wait()};mu.Unlock()}()};mu.Lock();ready=true;c.Broadcast();mu.Unlock();wg.Wait();fmt.Println(\"all\")\n}\n","expected":"all","why":"Broadcast barcha kutuvchilarni signal qiladi.","level":"Middle · Real holat"},{"name":"Queue condition","code":"// sync.Cond va spurious wakeup\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype BlockingQueue struct{mu sync.Mutex; cond *sync.Cond;items []int}\nfunc(q *BlockingQueue)init(){if q.cond==nil{q.cond=sync.NewCond(&q.mu)}}\nfunc(q *BlockingQueue)Push(v int){q.mu.Lock();q.init();q.items=append(q.items,v);q.cond.Signal();q.mu.Unlock()}\nfunc(q *BlockingQueue)Pop()int{q.mu.Lock();q.init();for len(q.items)==0{q.cond.Wait()};v:=q.items[0];q.items=q.items[1:];q.mu.Unlock();return v}\n\nfunc main() {\n\tq:=&BlockingQueue{items:[]int{}};done:=make(chan int);go func(){done<-q.Pop()}();q.Push(25);fmt.Println(<-done)\n}\n","expected":"25","why":"Queue bo‘sh bo‘lsa consumer wait qiladi, producer Signal qiladi.","level":"Senior · Murakkab"}]},{"id":"m4-t4","title":"sync.Pool va allocation","terms":["sync.Pool","Get","Put","GC","Buffer reuse"],"theory":"sync.Pool vaqtinchalik obyektlar qayta ishlatilishi uchun. GC pool elementlarini olib tashlashi mumkin, shuning uchun doimiy cache emas. Buffer pooling allocation bosimini kamaytirishi mumkin.","risk":"Pooldan olingan obyektni eski ma’lumotlaridan tozalamasdan qaytarish xavfli.","drill":"bytes.Buffer qayta ishlatilishini benchmarklang.","examples":[{"name":"sync.Poolga obyekt qo‘yish","code":"// sync.Pool va allocation\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"bytes\"\n)\n\nfunc main() {\n\tp:=sync.Pool{New:func()any{return new(bytes.Buffer)}};b:=p.Get().(*bytes.Buffer);b.WriteString(\"hello\");fmt.Println(b.String());b.Reset();p.Put(b)\n}\n","expected":"hello","why":"Get qayta ishlatilgan yoki yangi buffer beradi.","level":"Junior · Sodda"},{"name":"Loop ichida buffer reuse","code":"// sync.Pool va allocation\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"bytes\"\n)\n\nfunc main() {\n\tp:=sync.Pool{New:func()any{return new(bytes.Buffer)}};for i:=0;i<3;i++{b:=p.Get().(*bytes.Buffer);b.Reset();fmt.Fprint(b,\"id=\",i);fmt.Println(b.String());p.Put(b)}\n}\n","expected":"id=0, id=1, id=2","why":"Reset eski ma’lumotlarni keyingi ishlovga qo‘shilishini oldini oladi.","level":"Middle · Real holat"},{"name":"Parallel buffer pool","code":"// sync.Pool va allocation\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"bytes\"\n)\n\nfunc main() {\n\tp:=sync.Pool{New:func()any{return new(bytes.Buffer)}};var wg sync.WaitGroup;for i:=0;i<5;i++{wg.Add(1);go func(i int){defer wg.Done();b:=p.Get().(*bytes.Buffer);b.Reset();fmt.Fprint(b,i);s:=b.String();p.Put(b);fmt.Println(s)}(i)};wg.Wait()\n}\n","expected":"0..4 ixtiyoriy tartibda","why":"Poolga qaytargandan keyin bufferga yana murojaat qilinmaydi.","level":"Senior · Murakkab"}]},{"id":"m4-t5","title":"Atomic va CAS patternlari","terms":["sync/atomic","Atomic counter","CAS","CompareAndSwap","Atomic pointer"],"theory":"Atomic alohida qiymat ustida race-free operatsiyalarni ta’minlaydi. CAS eski qiymat mos kelgandagina almashtiradi. Bu optimistic update va lock-free algoritmlar asosidir.","risk":"Bir nechta alohida atomic fielddan iborat biznes invariant avtomatik atomik bo‘lmaydi.","drill":"CAS bilan bir martalik status o‘zgarishini yozing.","examples":[{"name":"Atomic counter","code":"// Atomic va CAS patternlari\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar a atomic.Int64;a.Add(1);a.Add(2);fmt.Println(a.Load())\n}\n","expected":"3","why":"Add va Load race-free.","level":"Junior · Sodda"},{"name":"CAS status transition","code":"// Atomic va CAS patternlari\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar state atomic.Int32;ok:=state.CompareAndSwap(0,1);again:=state.CompareAndSwap(0,1);fmt.Println(ok,again,state.Load())\n}\n","expected":"true false 1","why":"Birgina goroutine transitionni muvaffaqiyatli amalga oshiradi.","level":"Middle · Real holat"},{"name":"Atomic snapshot","code":"// Atomic va CAS patternlari\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Config struct{Limit int};var p atomic.Pointer[Config];p.Store(&Config{Limit:50});var wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(p.Load().Limit)}()};wg.Wait();p.Store(&Config{Limit:100});fmt.Println(\"new\",p.Load().Limit)\n}\n","expected":"50 va new 100","why":"Yangi immutable configni to‘liq yaratib, pointerga publish qiling.","level":"Senior · Murakkab"}]},{"id":"m4-t6","title":"Custom spin, ticket, Peterson lock","terms":["Spin lock","Ticket lock","Peterson mutex","Primitive mutex"],"theory":"Spin lock bo‘shashni CPU bilan kuzatadi. Ticket lock kutuvchiga ketma-ket raqam beradi. Peterson algoritmi ikki ishtirokchi uchun klassik mutual exclusion modelidir.","risk":"Custom locklar murakkab; productionda sync.Mutex afzal. Go memory modelini chetlab o‘tmang.","drill":"Spin lockning CPU sarfini oddiy mutex bilan solishtiring.","examples":[{"name":"Busy waiting nimaga xavfli","code":"// Custom spin, ticket, Peterson lock\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tready:=make(chan struct{});go func(){close(ready)}();<-ready;fmt.Println(\"ready\")\n}\n","expected":"ready","why":"Channel CPUni band qilib turmaydi; spin o‘rniga kutish afzal.","level":"Junior · Sodda"},{"name":"CAS lock tajribasi","code":"// Custom spin, ticket, Peterson lock\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n\t\"runtime\"\n)\n\nfunc main() {\n\tvar locked atomic.Bool;for !locked.CompareAndSwap(false,true){runtime.Gosched()};fmt.Println(\"locked\");locked.Store(false)\n}\n","expected":"locked","why":"Soddalashtirilgan spin lock: haqiqiy kodda sync.Mutex afzal.","level":"Middle · Real holat"},{"name":"Ticket navbat modeli","code":"// Custom spin, ticket, Peterson lock\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar next atomic.Uint64;for i:=0;i<3;i++{fmt.Println(\"ticket\",next.Add(1)-1)}\n}\n","expected":"ticket 0,1,2","why":"Ticket ID adolatli navbat fikrini ko‘rsatadi; bu to‘liq lock realizatsiyasi emas.","level":"Senior · Murakkab"}]},{"id":"m4-t7","title":"Recursive, timed mutex, semaphore","terms":["Recursive mutex","Timed mutex","Semaphore","RW mutex implementation"],"theory":"Recursive lock bir egadan qayta olishni talab qiladi; Go sync.Mutexda bunday funksiya yo‘q. Timed lock muddat bilan kutish, semaphore esa bir paytdagi ish sonini cheklash uchun.","risk":"Goroutine IDga tayanib recursive mutex yozish yaxshi amaliyot emas.","drill":"APIga parallel 5 ta so‘rov limitini yarating.","examples":[{"name":"Sig‘im 2 bo‘lgan semaphore","code":"// Recursive, timed mutex, semaphore\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tsem:=make(chan struct{},2);sem<-struct{}{};sem<-struct{}{};fmt.Println(\"2 slots occupied\");<-sem\n}\n","expected":"2 slots occupied","why":"Buffered channel tokenli semaphore sifatida ishlaydi.","level":"Junior · Sodda"},{"name":"3 parallel task limiti","code":"// Recursive, timed mutex, semaphore\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tsem:=make(chan struct{},3);var wg sync.WaitGroup;for i:=0;i<10;i++{sem<-struct{}{};wg.Add(1);go func(i int){defer wg.Done();defer func(){<-sem}();fmt.Println(i)}(i)};wg.Wait()\n}\n","expected":"0..9 bajariladi","why":"Limit oshib ketsa producer token kutadi.","level":"Middle · Real holat"},{"name":"Contextli semaphore acquire","code":"// Recursive, timed mutex, semaphore\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),20*time.Millisecond);defer cancel();sem:=make(chan struct{},1);sem<-struct{}{}\n\tselect{case sem<-struct{}{}:fmt.Println(\"acquired\");case <-ctx.Done():fmt.Println(\"timeout\")}\n}\n","expected":"timeout","why":"Acquirega cancellation qo‘shilishi cheksiz kutishdan saqlaydi.","level":"Senior · Murakkab"}]},{"id":"m4-t8","title":"Pool/Once implementatsiyasi, Linux futex","terms":["Pool implementation","Once implementation","Linux futex","Kernel mutex","sync.Mutex internals"],"theory":"Once uchun state va kutish signali, pool uchun qayta ishlatiladigan obyektlar ombori kerak. OS futex kontseptsiyasi user-space holatini kutish va zaruratda kernelga murojaat qilish bilan bog‘liq.","risk":"Bu mavzular platformaga va Go versiyasiga bog‘liq; tajriba uchun yozing, standart kutubxonani almashtirmang.","drill":"Once ni ikki marta ishlamaydigan test bilan tekshiring.","examples":[{"name":"Once faqat bir marta","code":"// Pool/Once implementatsiyasi, Linux futex\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar once sync.Once;for i:=0;i<3;i++{once.Do(func(){fmt.Println(\"init\")})}\n}\n","expected":"init (bir marta)","why":"Bir necha Do bo‘lsa ham birinchi funksiya bitta marta.","level":"Junior · Sodda"},{"name":"Parallel lazy init","code":"// Pool/Once implementatsiyasi, Linux futex\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar once sync.Once;var wg sync.WaitGroup;count:=0;for i:=0;i<10;i++{wg.Add(1);go func(){defer wg.Done();once.Do(func(){count=42})}()};wg.Wait();fmt.Println(count)\n}\n","expected":"42","why":"Do tugaganidan so‘ng other callers natijani ko‘radi.","level":"Middle · Real holat"},{"name":"Config lazy loader","code":"// Pool/Once implementatsiyasi, Linux futex\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype Config struct{ once sync.Once; value string }\nfunc(c *Config)Get()string{c.once.Do(func(){c.value=\"ready\"});return c.value}\n\nfunc main() {\n\tc:=&Config{};var wg sync.WaitGroup;for i:=0;i<4;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(c.Get())}()};wg.Wait()\n}\n","expected":"ready (4 marta)","why":"Once struct ichida config initializationni himoyalaydi.","level":"Senior · Murakkab"}]},{"id":"m4-t9","title":"Cache contention va false sharing","terms":["True sharing","False sharing","Busy waiting","Cache contention","Cache line"],"theory":"True sharing bir qiymat ustida umumiy yozish, false sharing esa alohida fieldlar bitta cache linega tushib to‘qnashishidir. Cache locality va contention performancega kuchli ta’sir qiladi.","risk":"Padding o‘lchamini arxitekturaga bog‘liq deb biling; isbotlanmagan micro-optimization qilmang.","drill":"Sharded counter bilan throughput o‘lchang.","examples":[{"name":"Atomic counter","code":"// Cache contention va false sharing\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar a atomic.Int64;a.Add(1);a.Add(2);fmt.Println(a.Load())\n}\n","expected":"3","why":"Add va Load race-free.","level":"Junior · Sodda"},{"name":"CAS status transition","code":"// Cache contention va false sharing\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar state atomic.Int32;ok:=state.CompareAndSwap(0,1);again:=state.CompareAndSwap(0,1);fmt.Println(ok,again,state.Load())\n}\n","expected":"true false 1","why":"Birgina goroutine transitionni muvaffaqiyatli amalga oshiradi.","level":"Middle · Real holat"},{"name":"Atomic snapshot","code":"// Cache contention va false sharing\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Config struct{Limit int};var p atomic.Pointer[Config];p.Store(&Config{Limit:50});var wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(p.Load().Limit)}()};wg.Wait();p.Store(&Config{Limit:100});fmt.Println(\"new\",p.Load().Limit)\n}\n","expected":"50 va new 100","why":"Yangi immutable configni to‘liq yaratib, pointerga publish qiling.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"RWMutexda RLockni bir nechta G olishi mumkinmi?","options":["Ha","Yo‘q","Faqat 1"],"correct":0,"reason":"Readerlar parallel o‘qishi mumkin."},{"q":"sync.Pool doimiy cachemi?","options":["Ha","Yo‘q","Faqat string uchun"],"correct":1,"reason":"GC poolni tozalashi mumkin."},{"q":"CAS qachon update qiladi?","options":["Har doim","Kutilgan eski qiymat mos bo‘lsa","Delaydan so‘ng"],"correct":1,"reason":"Compare-And-Swap — shartli atomik update."}]},{"id":"m5","num":5,"title":"Channel va ichki mexanizmlar","summary":"Buffered/unbuffered, select, yopish, leak va shutdown.","goal":"Channel orqali xavfsiz kommunikatsiya va cancellation.","homework":"DB uchun WAL va restartdan recovery mexanizmi.","topics":[{"id":"m5-t1","title":"Buffered va unbuffered channel","terms":["Channel","Unbuffered","Buffered","Capacity","Send","Receive"],"theory":"Unbuffered channel yuboruvchi va qabul qiluvchini uchrashtiradi. Buffered channel cheklangan miqdorda xabarni navbatda ushlaydi. Buffer backpressure xatti-harakatini o‘zgartiradi.","risk":"Katta buffer avtomatik yaxshi: to‘lib ketish, latency va RAMni kuzating.","drill":"Buffer 0 va 3 holatidagi yuborishni sinang.","examples":[{"name":"Unbuffered channel","code":"// Buffered va unbuffered channel\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tch:=make(chan int);go func(){ch<-42}();fmt.Println(<-ch)\n}\n","expected":"42","why":"Yuboruvchi receiver tayyor bo‘lgunga qadar kutadi.","level":"Junior · Sodda"},{"name":"Buffered channel","code":"// Buffered va unbuffered channel\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tch:=make(chan string,2);ch<-\"a\";ch<-\"b\";fmt.Println(<-ch,<-ch)\n}\n","expected":"a b","why":"Buffer sig‘imi 2, send vaqtincha consumer bo‘lmasa ham bajariladi.","level":"Middle · Real holat"},{"name":"Bounded pipeline stage","code":"// Buffered va unbuffered channel\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tin:=make(chan int,3);out:=make(chan int,3);go func(){defer close(out);for v:=range in{out<-v*2}}();for _,n:=range []int{1,2,3}{in<-n};close(in);for v:=range out{fmt.Println(v)}\n}\n","expected":"2,4,6","why":"Producer in ni yopadi, transformer outni yopadi.","level":"Senior · Murakkab"}]},{"id":"m5-t2","title":"Directional channel va ownership","terms":["Send-only chan<-","Receive-only <-chan","Channel ownership","Share memory by communicating"],"theory":"Directional channel API qaysi tomon yuborishi yoki qabul qilishini cheklaydi. Ownership kim channelni yopishini aniq belgilaydi. Communicate by sharing emas, share memory by communicating tamoyilini yodda tuting.","risk":"Channelga qiymat yuborish pointer orqali umumiy mutable obyekt ulashishdan farq qilmay qolishi mumkin.","drill":"Producer channelni yopadi, consumer range bilan o‘qiydi.","examples":[{"name":"Send-only parametri","code":"// Directional channel va ownership\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tsend:=func(out chan<- int){out<-7;close(out)};ch:=make(chan int);go send(ch);fmt.Println(<-ch)\n}\n","expected":"7","why":"Function channelga faqat yubora oladi.","level":"Junior · Sodda"},{"name":"Producer ownership","code":"// Directional channel va ownership\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tgenerate:=func() <-chan int{out:=make(chan int);go func(){defer close(out);for i:=0;i<3;i++{out<-i}}();return out};for n:=range generate(){fmt.Println(n)}\n}\n","expected":"0 1 2","why":"Yopish bitta producerga tegishli.","level":"Middle · Real holat"},{"name":"Domen obyektlar oqimi","code":"// Directional channel va ownership\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Order struct{ID int;Price int};orders:=make(chan Order,3);go func(){defer close(orders);for i:=1;i<=3;i++{orders<-Order{ID:i,Price:i*100}}}();total:=0;for o:=range orders{total+=o.Price};fmt.Println(total)\n}\n","expected":"600","why":"Struct channel orqali ko‘chiriladi; ichidagi pointer fieldlar bo‘lsa sharingga e’tibor bering.","level":"Senior · Murakkab"}]},{"id":"m5-t3","title":"close, ok va double close","terms":["close","ok receive","Close ownership","Send on closed","Compare channel","Copy channel"],"theory":"Yopilgan va bo‘sh channeldan o‘qish zero value hamda `ok=false` qaytaradi. Yopiq channelga yuborish panic qiladi. Channel qiymatini nusxalash yangi queue yaratmaydi.","risk":"Har bir yuborishdan oldin isClosed tekshirish atomik xavfsizlik bermaydi.","drill":"Yopilgan channeldan range qanday tugashini tekshiring.","examples":[{"name":"close + ok","code":"// close, ok va double close\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tch:=make(chan int,1);ch<-5;close(ch);a,ok1:=<-ch;b,ok2:=<-ch;fmt.Println(a,ok1,b,ok2)\n}\n","expected":"5 true 0 false","why":"Close bu ferma: buffer bo‘shagach zero value + false.","level":"Junior · Sodda"},{"name":"Range yopilishda tugaydi","code":"// close, ok va double close\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tch:=make(chan int,2);ch<-10;ch<-20;close(ch);for x:=range ch{fmt.Println(x)}\n}\n","expected":"10 20","why":"Consumer closure signalini alohida yubormasdan range bilan tugaydi.","level":"Middle · Real holat"},{"name":"Channel aynan bir obyekt","code":"// close, ok va double close\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ta:=make(chan int,1);b:=a;fmt.Println(a==b);b<-99;fmt.Println(<-a)\n}\n","expected":"true, 99","why":"Channel qiymatini copy qilish underlying channelni nusxalamaydi.","level":"Senior · Murakkab"}]},{"id":"m5-t4","title":"select, default, nil va break","terms":["select","Case selection","default","Nonblocking","Nil channel","break","continue"],"theory":"Bir nechta case tayyor bo‘lsa select birini pseudo-random tanlaydi. `default` bo‘lsa kutish shart emas. Nil channelga yuborish/o‘qish bloklanadi va select case sifatida o‘chirilgan hisoblanadi.","risk":"`break` faqat selectdan chiqishi mumkin; tashqi loop uchun label ishlating.","drill":"Timeoutli receive va nonblocking sendni bajaring.","examples":[{"name":"Non-blocking receive","code":"// select, default, nil va break\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tch:=make(chan int);select{case v:=<-ch:fmt.Println(v);default:fmt.Println(\"empty\")}\n}\n","expected":"empty","why":"default sabab select kutmaydi.","level":"Junior · Sodda"},{"name":"Timeoutli select","code":"// select, default, nil va break\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tch:=make(chan string);select{case v:=<-ch:fmt.Println(v);case <-time.After(20*time.Millisecond):fmt.Println(\"timeout\")}\n}\n","expected":"timeout","why":"Timer channel send/receive kutishini cheklaydi.","level":"Middle · Real holat"},{"name":"Nil channelni o‘chirib qo‘yish","code":"// select, default, nil va break\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ta:=make(chan int,1);a<-1;close(a);var active <-chan int=a;for active!=nil{select{case v,ok:=<-active:if !ok{active=nil;continue};fmt.Println(v)}};fmt.Println(\"finished\")\n}\n","expected":"1 finished","why":"Nil channel select case ni o‘chiradi; yopilgan channelni aylantirib o‘qishdan saqlaydi.","level":"Senior · Murakkab"}]},{"id":"m5-t5","title":"Channel internals va deadlock","terms":["hchan","Circular buffer","Send queue","Receive queue","Channel deadlock"],"theory":"Channel runtime ichida buffer, kutuvchi goroutine navbatlari va synchronization holatini tutadi. Deadlock yuz berishi uchun barcha progress yo‘llari o‘zaro kutilib qolishi mumkin.","risk":"Ichki layout Go versiyalarida o‘zgaradi. Buffer bo‘sh emasligi har doim progress kafolati emas.","drill":"Qaysi yuborish bloklanishini jadvalda tushuntiring.","examples":[{"name":"Unbuffered channel","code":"// Channel internals va deadlock\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tch:=make(chan int);go func(){ch<-42}();fmt.Println(<-ch)\n}\n","expected":"42","why":"Yuboruvchi receiver tayyor bo‘lgunga qadar kutadi.","level":"Junior · Sodda"},{"name":"Buffered channel","code":"// Channel internals va deadlock\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tch:=make(chan string,2);ch<-\"a\";ch<-\"b\";fmt.Println(<-ch,<-ch)\n}\n","expected":"a b","why":"Buffer sig‘imi 2, send vaqtincha consumer bo‘lmasa ham bajariladi.","level":"Middle · Real holat"},{"name":"Bounded pipeline stage","code":"// Channel internals va deadlock\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tin:=make(chan int,3);out:=make(chan int,3);go func(){defer close(out);for v:=range in{out<-v*2}}();for _,n:=range []int{1,2,3}{in<-n};close(in);for v:=range out{fmt.Println(v)}\n}\n","expected":"2,4,6","why":"Producer in ni yopadi, transformer outni yopadi.","level":"Senior · Murakkab"}]},{"id":"m5-t6","title":"Channel of channels, signals, broadcast","terms":["chan chan T","Signal","Broadcast","Done channel","Communication"],"theory":"Channel ichida channel yuborish orqali har bir request uchun reply channel berish mumkin. Yopilgan done channel barcha receive kutuvchilarni uyg‘otadi. Oddiy signal va broadcast farqini ajrating.","risk":"Reply channel lifetime va timeout nazoratsiz bo‘lsa goroutine leak kelib chiqadi.","drill":"Har requestga alohida response channel yozing.","examples":[{"name":"Channel of channels","code":"// Channel of channels, signals, broadcast\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tresponses:=make(chan chan int,1);reply:=make(chan int,1);responses<-reply;go func(){r:=<-responses;r<-200}();fmt.Println(<-reply)\n}\n","expected":"200","why":"Bitta channel orqali response channelni yuborish mumkin.","level":"Junior · Sodda"},{"name":"Per-request reply","code":"// Channel of channels, signals, broadcast\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Req struct{N int;Reply chan int};reqs:=make(chan Req);go func(){for r:=range reqs{r.Reply<-r.N*r.N}}();resp:=make(chan int,1);reqs<-Req{N:7,Reply:resp};fmt.Println(<-resp);close(reqs)\n}\n","expected":"49","why":"Har request uchun mustaqil response channel.","level":"Middle · Real holat"},{"name":"Timeoutli reply","code":"// Channel of channels, signals, broadcast\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\ttype Req struct{Reply chan string};jobs:=make(chan Req);go func(){for j:=range jobs{select{case j.Reply<-\"ok\":case <-time.After(20*time.Millisecond):}}}();reply:=make(chan string,1);jobs<-Req{Reply:reply};select{case v:=<-reply:fmt.Println(v);case <-time.After(time.Second):fmt.Println(\"timeout\")};close(jobs)\n}\n","expected":"ok","why":"Reply yo‘qolsa workerda abadiy blok bo‘lmasligi uchun bounded reply channel qo‘llanadi.","level":"Senior · Murakkab"}]},{"id":"m5-t7","title":"Producer-consumer, goroutine leaks, shutdown","terms":["Producer","Consumer","Goroutine leak","Graceful shutdown"],"theory":"Producer task yuboradi, consumer qayta ishlaydi. Consumer erta chiqsa, producer yuborishda abadiy kutib qolishi mumkin. Shutdown uchun done/context va barcha workerlarni kutish zarur.","risk":"Channelni bir necha producer o‘zi bilganicha yopmasin.","drill":"Consumer erta chiqsa producer ham chiqadigan qiling.","examples":[{"name":"Bitta worker","code":"// Producer-consumer, goroutine leaks, shutdown\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tjobs:=make(chan int,3);for i:=1;i<=3;i++{jobs<-i};close(jobs);for n:=range jobs{fmt.Println(\"job\",n)}\n}\n","expected":"job 1..3","why":"Consumer queue bo‘shaguncha ishlaydi.","level":"Junior · Sodda"},{"name":"4 worker bilan queue","code":"// Producer-consumer, goroutine leaks, shutdown\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tjobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<4;w++{wg.Add(1);go func(){defer wg.Done();for id:=range jobs{fmt.Println(\"done\",id)}}()};for id:=1;id<=12;id++{jobs<-id};close(jobs);wg.Wait()\n}\n","expected":"12 ta done","why":"Bounded worker pool konkurent ish sonini cheklaydi.","level":"Middle · Real holat"},{"name":"Contextli worker pool","code":"// Producer-consumer, goroutine leaks, shutdown\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());jobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<3;w++{wg.Add(1);go func(){defer wg.Done();for{select{case <-ctx.Done():return;case j,ok:=<-jobs:if !ok{return};fmt.Println(\"job\",j)}}}()};for i:=0;i<5;i++{jobs<-i};close(jobs);wg.Wait();cancel()\n}\n","expected":"5 ta job","why":"Kanalni yopish va context cancellation ikkita lifecycle vositasi.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"Close kimning mas’uliyati?","options":["Istalgan consumer","Odatda yuboruvchi/owner","Runtime"],"correct":1,"reason":"Ownership aniqligi double close/send panicdan saqlaydi."},{"q":"Yopiq bo‘sh channel receive?","options":["ok=false","panic","deadlock"],"correct":0,"reason":"Zero value va ok=false."},{"q":"Nil channel select case?","options":["Doim tayyor","Deaktivatsiya bo‘ladi","Auto-close"],"correct":1,"reason":"Nil channel send/receive hech qachon ready bo‘lmaydi."}]},{"id":"m6","num":6,"title":"Channel patternlari","summary":"Pipeline, fan-in/out, rate limiter va time primitives.","goal":"Qayta ishlatiladigan concurrency patternlarni to‘g‘ri loyihalash.","homework":"WAL batching va diskka chiqarishni davom ettirish.","topics":[{"id":"m6-t1","title":"Generator, transformer, pipeline","terms":["Generator","Transformer","Pipeline"],"theory":"Generator oqim hosil qiladi, transformer uni o‘zgartiradi, pipeline bir nechta stage dan tuziladi. Har stage cancellationni tushunishi zarur.","risk":"Downstream ishlashdan to‘xtasa upstreamni cancel qiling.","drill":"son → kvadrat → filtrlash pipelineini tuzing.","examples":[{"name":"Generator","code":"// Generator, transformer, pipeline\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tout:=make(chan int);go func(){defer close(out);for i:=1;i<=3;i++{out<-i}}();for x:=range out{fmt.Println(x)}\n}\n","expected":"1 2 3","why":"Oqim ishlab chiqaruvchi yakunda outni yopadi.","level":"Junior · Sodda"},{"name":"Transformer stage","code":"// Generator, transformer, pipeline\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tin:=make(chan int,3);out:=make(chan int,3);go func(){defer close(out);for x:=range in{out<-x*x}}();for i:=1;i<=3;i++{in<-i};close(in);for n:=range out{fmt.Println(n)}\n}\n","expected":"1 4 9","why":"Bir stage inputni kvadratga o‘zgartiradi.","level":"Middle · Real holat"},{"name":"Cancel bo‘ladigan pipeline","code":"// Generator, transformer, pipeline\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());defer cancel();out:=make(chan int)\n\tgo func(){defer close(out);for i:=1;i<=100;i++{select{case out<-i:case <-ctx.Done():return}}}();for v:=range out{fmt.Println(v);if v==3{cancel()}}\n}\n","expected":"Kamida 1,2,3; keyin ba’zi qiymatlar chiqishi mumkin","why":"Cancellation signal asinxron; `select`da ikki case tayyor bo‘lsa birini tanlaydi.","level":"Senior · Murakkab"}]},{"id":"m6-t2","title":"Fan-out, fan-in va tee","terms":["Fan-Out","Fan-In","Tee","Parallel stages"],"theory":"Fan-out bitta inputni bir nechta workerga bo‘lib beradi. Fan-in ko‘p result channelni birlashtiradi. Tee bitta xabarni ikki chiqishga uzatadi.","risk":"Natijalar tartibi saqlanishi shart bo‘lsa sequence ID ishlating.","drill":"4 worker natijasini bitta channelga birlashtiring.","examples":[{"name":"Bitta worker","code":"// Fan-out, fan-in va tee\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tjobs:=make(chan int,3);for i:=1;i<=3;i++{jobs<-i};close(jobs);for n:=range jobs{fmt.Println(\"job\",n)}\n}\n","expected":"job 1..3","why":"Consumer queue bo‘shaguncha ishlaydi.","level":"Junior · Sodda"},{"name":"4 worker bilan queue","code":"// Fan-out, fan-in va tee\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tjobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<4;w++{wg.Add(1);go func(){defer wg.Done();for id:=range jobs{fmt.Println(\"done\",id)}}()};for id:=1;id<=12;id++{jobs<-id};close(jobs);wg.Wait()\n}\n","expected":"12 ta done","why":"Bounded worker pool konkurent ish sonini cheklaydi.","level":"Middle · Real holat"},{"name":"Contextli worker pool","code":"// Fan-out, fan-in va tee\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());jobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<3;w++{wg.Add(1);go func(){defer wg.Done();for{select{case <-ctx.Done():return;case j,ok:=<-jobs:if !ok{return};fmt.Println(\"job\",j)}}}()};for i:=0;i<5;i++{jobs<-i};close(jobs);wg.Wait();cancel()\n}\n","expected":"5 ta job","why":"Kanalni yopish va context cancellation ikkita lifecycle vositasi.","level":"Senior · Murakkab"}]},{"id":"m6-t3","title":"Bridge, or, or-done, done","terms":["Bridge","Or channel","Or-done channel","Done channel"],"theory":"Bridge chan chan T oqimlarini bitta oqimga birlashtiradi. Or bir nechta done signaldan birinchisini qabul qiladi, or-done receive operatsiyalarini cancellationga bo‘ysundiradi.","risk":"Har pattern goroutine yaratishi mumkin: shutdown va ownershipni tekshiring.","drill":"3 done signaldan birinchisi kelganda to‘xtang.","examples":[{"name":"Broadcast close","code":"// Bridge, or, or-done, done\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});var wg sync.WaitGroup;for i:=0;i<2;i++{wg.Add(1);go func(){defer wg.Done();<-done;fmt.Println(\"stopped\")}()};close(done);wg.Wait()\n}\n","expected":"stopped (2 marta)","why":"close(done) barcha receive kutuvchilariga signal.","level":"Junior · Sodda"},{"name":"Or signal: birinchi kelgani","code":"// Bridge, or, or-done, done\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ta,b:=make(chan struct{}),make(chan struct{});out:=make(chan struct{});go func(){select{case <-a:case <-b:};close(out)}();close(b);<-out;fmt.Println(\"one fired\")\n}\n","expected":"one fired","why":"Bir nechta signalni select orqali birlashtirish.","level":"Middle · Real holat"},{"name":"Leak-free generator with ctx","code":"// Bridge, or, or-done, done\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());out:=make(chan int);done:=make(chan struct{})\n\tgo func(){defer close(done);defer close(out);for i:=0;;i++{select{case out<-i:case <-ctx.Done():return}}}();fmt.Println(<-out);cancel();<-done;fmt.Println(\"closed\")\n}\n","expected":"0 closed","why":"Consumer to‘xtaganda upstream cancel qilinadi va worker tugashi kutiladi.","level":"Senior · Murakkab"}]},{"id":"m6-t4","title":"Promise, future va moving later","terms":["Promise","Future","Moving later","Hedged requests"],"theory":"Future asinxron natijani keyin o‘qishga imkon beradi. Moving later/hedged requests bir nechta alternativni parallel chaqirib birinchi mos natijani oladi.","risk":"Hedging takroriy traffic va xarajatni oshiradi; faqat idempotent o‘qishlarda ehtiyotkorlik bilan.","drill":"Ikki sekin replikadan birinchi muvaffaqiyatli javobni oling.","examples":[{"name":"Future channel","code":"// Promise, future va moving later\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tfuture:=make(chan int,1);go func(){future<-42}();fmt.Println(<-future)\n}\n","expected":"42","why":"Natija hisoblanayotgan paytda main boshqa ish qila oladi.","level":"Junior · Sodda"},{"name":"Result bilan error","code":"// Promise, future va moving later\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Result struct{Value int;Err error};future:=make(chan Result,1);go func(){future<-Result{Value:7*7}}();r:=<-future;fmt.Println(r.Value,r.Err)\n}\n","expected":"49 nil","why":"Natija va error bir obyektda uzatiladi.","level":"Middle · Real holat"},{"name":"Ikkita replikadan tezrog‘i","code":"// Promise, future va moving later\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());defer cancel();res:=make(chan string,2)\n\tfor i,delay:=rang
