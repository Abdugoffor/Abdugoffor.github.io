e []time.Duration{30*time.Millisecond,10*time.Millisecond}{go func(id int,d time.Duration){select{case <-time.After(d):select{case res<-fmt.Sprint(\"replica\",id):case <-ctx.Done():};case <-ctx.Done():}}(i,delay)}\n\tfmt.Println(<-res);cancel()\n}\n","expected":"replica1","why":"Birinci javob olingach qolgan requestlar cancellationni ko‘rishi kerak.","level":"Senior · Murakkab"}]},{"id":"m6-t5","title":"Errgroup va semaphore","terms":["Error group","Semaphore","Bounded concurrency"],"theory":"Errgroup bog‘liq ishlar xatosini yig‘ish va contextni cancel qilish uchun. Semaphore concurrent vazifalar sonini cheklaydi.","risk":"Semaphore vaqt bo‘yicha rate limit emas.","drill":"Bir vaqtda 3 dan ortiq HTTP request bo‘lmasin.","examples":[{"name":"Sig‘im 2 bo‘lgan semaphore","code":"// Errgroup va semaphore\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tsem:=make(chan struct{},2);sem<-struct{}{};sem<-struct{}{};fmt.Println(\"2 slots occupied\");<-sem\n}\n","expected":"2 slots occupied","why":"Buffered channel tokenli semaphore sifatida ishlaydi.","level":"Junior · Sodda"},{"name":"3 parallel task limiti","code":"// Errgroup va semaphore\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tsem:=make(chan struct{},3);var wg sync.WaitGroup;for i:=0;i<10;i++{sem<-struct{}{};wg.Add(1);go func(i int){defer wg.Done();defer func(){<-sem}();fmt.Println(i)}(i)};wg.Wait()\n}\n","expected":"0..9 bajariladi","why":"Limit oshib ketsa producer token kutadi.","level":"Middle · Real holat"},{"name":"Contextli semaphore acquire","code":"// Errgroup va semaphore\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),20*time.Millisecond);defer cancel();sem:=make(chan struct{},1);sem<-struct{}{}\n\tselect{case sem<-struct{}{}:fmt.Println(\"acquired\");case <-ctx.Done():fmt.Println(\"timeout\")}\n}\n","expected":"timeout","why":"Acquirega cancellation qo‘shilishi cheksiz kutishdan saqlaydi.","level":"Senior · Murakkab"}]},{"id":"m6-t6","title":"Rate limiter va singleflight","terms":["Rate limiter","Token bucket","Singleflight","Request coalescing"],"theory":"Rate limiter vaqt oralig‘ida maksimal ish tezligini cheklaydi. Singleflight bir xil keydagi concurrent hisoblashni bitta real bajarishga birlashtiradi.","risk":"Singleflight cache emas va faqat bitta process ichida ishlaydi; multi-instance uchun koordinatsiya kerak.","drill":"Bir xil keyli 50 request DBga bir martadan oshmasin.","examples":[{"name":"Ticker bilan rate limit","code":"// Rate limiter va singleflight\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\ttick:=time.NewTicker(10*time.Millisecond);defer tick.Stop();for i:=0;i<3;i++{<-tick.C;fmt.Println(\"allowed\",i)}\n}\n","expected":"allowed 0..2","why":"Har intervalda bittadan ishga ruxsat berildi.","level":"Junior · Sodda"},{"name":"Token bucket buffer","code":"// Rate limiter va singleflight\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttokens:=make(chan struct{},2);tokens<-struct{}{};tokens<-struct{}{};for i:=0;i<2;i++{<-tokens;fmt.Println(\"request\",i)}\n}\n","expected":"request 0,1","why":"Burst 2 ga ruxsat, keyingi tokenlar refill bilan kelishi kerak.","level":"Middle · Real holat"},{"name":"Per-key coalescing (soddalashtirilgan)","code":"// Rate limiter va singleflight\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.Mutex;type Entry struct{ready chan struct{};value int};calls:=map[string]*Entry{}\n\tget:=func(key string)int{mu.Lock();if e,ok:=calls[key];ok{mu.Unlock();<-e.ready;return e.value};e:=&Entry{ready:make(chan struct{})};calls[key]=e;mu.Unlock();e.value=42;close(e.ready);return e.value};fmt.Println(get(\"user:1\"))\n}\n","expected":"42","why":"Bu soddalashtirilgan singleflight faqat bitta process ichida. Error/eviction productionda kerak.","level":"Senior · Murakkab"}]},{"id":"m6-t7","title":"Barrier va channel reflection","terms":["Barrier","Reflect.Select","Dynamic select"],"theory":"Barrier bir necha ishchini bir nuqtaga keltirib, so‘ng davom ettiradi. reflect.Select o‘zgaruvchan sonli channellar orasidan qabulni dinamik tanlaydi.","risk":"Reflection qimmat va xatoga moyil; oddiy select yoki fan-in afzal bo‘lishi mumkin.","drill":"3 worker barcha tayyor bo‘lguncha kutadigan qiling.","examples":[{"name":"WaitGroup barrier","code":"// Barrier va channel reflection\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(){defer wg.Done()}()};wg.Wait();fmt.Println(\"stage 2\")\n}\n","expected":"stage 2","why":"Stage 2 barcha worker stage 1ni tugatgandan keyin ishlaydi.","level":"Junior · Sodda"},{"name":"Start gate bilan bir vaqtli start","code":"// Barrier va channel reflection\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tstart:=make(chan struct{});var wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(id int){defer wg.Done();<-start;fmt.Println(\"run\",id)}(i)};close(start);wg.Wait()\n}\n","expected":"run 0,1,2 turli tartibda","why":"Barcha workerlar bir signalni kutadi.","level":"Middle · Real holat"},{"name":"Dinamik kanallarni reflect.Select","code":"// Barrier va channel reflection\npackage main\n\nimport (\n\t\"fmt\"\n\t\"reflect\"\n)\n\nfunc main() {\n\ta,b:=make(chan int,1),make(chan int,1);a<-10;b<-20;cases:=[]reflect.SelectCase{{Dir:reflect.SelectRecv,Chan:reflect.ValueOf(a)},{Dir:reflect.SelectRecv,Chan:reflect.ValueOf(b)}};_,v,ok:=reflect.Select(cases);fmt.Println(v.Int(),ok)\n}\n","expected":"10 yoki 20, true","why":"Runtimega ma’lum bo‘lgan dinamik channel ro‘yxatidan tanlash mumkin.","level":"Senior · Murakkab"}]},{"id":"m6-t8","title":"Ticker, Timer, After, Tick","terms":["time.Ticker","time.Timer","time.After","time.Tick"],"theory":"Timer bitta vaqt hodisasi, ticker davriy signal beradi. Modern Go versiyalarida timer lifecycle oldingi versiyalardan farqlanishi mumkin. Ish tugasa kerakli timerni Stop qiling.","risk":"Ticker signalni ishlov bera olmasangiz tashlab yuborishi mumkin; har tick uchun alohida job kafolati yo‘q.","drill":"Har 200msdagi eventni 1 sekunddan keyin to‘xtating.","examples":[{"name":"Timer bir marta","code":"// Ticker, Timer, After, Tick\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\ttimer:=time.NewTimer(10*time.Millisecond);defer timer.Stop();<-timer.C;fmt.Println(\"fired\")\n}\n","expected":"fired","why":"Timer bir marta signal beradi.","level":"Junior · Sodda"},{"name":"Ticker davriy","code":"// Ticker, Timer, After, Tick\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tticker:=time.NewTicker(5*time.Millisecond);defer ticker.Stop();for i:=0;i<3;i++{<-ticker.C;fmt.Println(\"tick\",i)}\n}\n","expected":"tick 0,1,2","why":"Ticker ma’lum intervalda signal beradi.","level":"Middle · Real holat"},{"name":"Cancellationli scheduler","code":"// Ticker, Timer, After, Tick\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),30*time.Millisecond);defer cancel();ticker:=time.NewTicker(10*time.Millisecond);defer ticker.Stop();for{select{case <-ticker.C:fmt.Println(\"work\");case <-ctx.Done():fmt.Println(\"stop\");return}}\n}\n","expected":"work bir necha marta, stop","why":"Context davriy loopni xavfsiz to‘xtatadi.","level":"Senior · Murakkab"}]},{"id":"m6-t9","title":"Timeout va graceful shutdown","terms":["Timeout","Graceful shutdown","Channel cancellation","Error propagation"],"theory":"Timeoutlar tashqi IO kutishni chegaralaydi. Graceful shutdown yangi ish qabulini to‘xtatadi, bor ishlarni kutadi va resurslarni yopadi. Channel send va receive ham cancel bo‘lishi kerak.","risk":"Timeout = operatsiyani majburan o‘ldirish emas; kod signalni hurmat qilishi kerak.","drill":"3 ta worker shutdown signalidan keyin chiqsin.","examples":[{"name":"Broadcast close","code":"// Timeout va graceful shutdown\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});var wg sync.WaitGroup;for i:=0;i<2;i++{wg.Add(1);go func(){defer wg.Done();<-done;fmt.Println(\"stopped\")}()};close(done);wg.Wait()\n}\n","expected":"stopped (2 marta)","why":"close(done) barcha receive kutuvchilariga signal.","level":"Junior · Sodda"},{"name":"Or signal: birinchi kelgani","code":"// Timeout va graceful shutdown\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ta,b:=make(chan struct{}),make(chan struct{});out:=make(chan struct{});go func(){select{case <-a:case <-b:};close(out)}();close(b);<-out;fmt.Println(\"one fired\")\n}\n","expected":"one fired","why":"Bir nechta signalni select orqali birlashtirish.","level":"Middle · Real holat"},{"name":"Leak-free generator with ctx","code":"// Timeout va graceful shutdown\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());out:=make(chan int);done:=make(chan struct{})\n\tgo func(){defer close(done);defer close(out);for i:=0;;i++{select{case out<-i:case <-ctx.Done():return}}}();fmt.Println(<-out);cancel();<-done;fmt.Println(\"closed\")\n}\n","expected":"0 closed","why":"Consumer to‘xtaganda upstream cancel qilinadi va worker tugashi kutiladi.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"Fan-out nima?","options":["Bitta inputni ko‘p workerga berish","DB indekslash","Log yozish"],"correct":0,"reason":"Ishlar bir necha consumerga tarqatiladi."},{"q":"Singleflight cachemi?","options":["Ha","Yo‘q","Faqat Redis"],"correct":1,"reason":"Bir xil concurrent ishni coalesce qiladi, persistent cache emas."},{"q":"Rate limiter va semaphore bir xilmi?","options":["Ha","Yo‘q","Faqat HTTPda"],"correct":1,"reason":"Rate vaqt birligidagi ish, semaphore bir vaqtning o‘zidagi ish."}]},{"id":"m7","num":7,"title":"Context va memory model","summary":"Cancellation tree, deadline va happens-before.","goal":"API/gRPC/DB request lifecycle ni to‘g‘ri yuritish.","homework":"WAL, timeout, recovery va toza shutdownni yakunlash.","topics":[{"id":"m7-t1","title":"Background, TODO va context tree","terms":["context.Background","context.TODO","Parent-child context","Context internals"],"theory":"Background ildiz context. TODO qaysi parent ishlatilishi aniqlanmaganda vaqtincha. Child context parent cancellation/deadline ta’sirida bo‘ladi.","risk":"Contextni nil qilib yubormang; request contextni barcha IO chaqiruvlarga uzating.","drill":"Parent bekor bo‘lganda child Done qachon yopilishini tekshiring.","examples":[{"name":"Background va value","code":"// Background, TODO va context tree\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\ntype traceKey struct{}\n\nfunc main() {\n\tctx:=context.WithValue(context.Background(),traceKey{},\"req-7\");fmt.Println(ctx.Value(traceKey{}))\n}\n","expected":"req-7","why":"Typed private key clash ehtimolini kamaytiradi.","level":"Junior · Sodda"},{"name":"Parent cancellation childga tarqaladi","code":"// Background, TODO va context tree\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tparent,cancel:=context.WithCancel(context.Background());child,_:=context.WithCancel(parent);cancel();<-child.Done();fmt.Println(child.Err())\n}\n","expected":"context canceled","why":"Parent bekor qilinsa child ham bekor bo‘ladi.","level":"Middle · Real holat"},{"name":"Worker lifecycle context","code":"// Background, TODO va context tree\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),25*time.Millisecond);defer cancel();done:=make(chan struct{})\n\tgo func(){defer close(done);for{select{case <-ctx.Done():return;case <-time.After(8*time.Millisecond):fmt.Println(\"heartbeat\")}}}();<-done;fmt.Println(\"stopped\")\n}\n","expected":"heartbeat bir necha marta, stopped","why":"Cancel — signal; goroutine uni kuzatib return qilishi kerak.","level":"Senior · Murakkab"}]},{"id":"m7-t2","title":"WithCancel va WithCancelCause","terms":["context.WithCancel","WithCancelCause","Cause","Cancellation propagation"],"theory":"WithCancel qaytargan cancel bajarilganida child context va unga bog‘langan avlodlar bekor qilinadi. Cause stop sababini error bilan saqlaydi.","risk":"cancel chaqirilmasa timer/parent bilan bog‘liq resurslar uzoq saqlanishi mumkin.","drill":"Ikki goroutine bittasi xato qilganda ikkalasi to‘xtasin.","examples":[{"name":"Background va value","code":"// WithCancel va WithCancelCause\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\ntype traceKey struct{}\n\nfunc main() {\n\tctx:=context.WithValue(context.Background(),traceKey{},\"req-7\");fmt.Println(ctx.Value(traceKey{}))\n}\n","expected":"req-7","why":"Typed private key clash ehtimolini kamaytiradi.","level":"Junior · Sodda"},{"name":"Parent cancellation childga tarqaladi","code":"// WithCancel va WithCancelCause\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tparent,cancel:=context.WithCancel(context.Background());child,_:=context.WithCancel(parent);cancel();<-child.Done();fmt.Println(child.Err())\n}\n","expected":"context canceled","why":"Parent bekor qilinsa child ham bekor bo‘ladi.","level":"Middle · Real holat"},{"name":"Worker lifecycle context","code":"// WithCancel va WithCancelCause\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),25*time.Millisecond);defer cancel();done:=make(chan struct{})\n\tgo func(){defer close(done);for{select{case <-ctx.Done():return;case <-time.After(8*time.Millisecond):fmt.Println(\"heartbeat\")}}}();<-done;fmt.Println(\"stopped\")\n}\n","expected":"heartbeat bir necha marta, stopped","why":"Cancel — signal; goroutine uni kuzatib return qilishi kerak.","level":"Senior · Murakkab"}]},{"id":"m7-t3","title":"WithDeadline va WithTimeout","terms":["context.WithDeadline","WithTimeout","Deadline","Timeout"],"theory":"Deadline aniq nuqta, Timeout nisbiy vaqt qo‘yadi. Pastdagi DB/query va HTTP operatsiyalar contextni qabul qilishi kerak.","risk":"Timeout tugashi tashqi tizimda allaqachon yozilgan amalni ortga qaytarmaydi.","drill":"DB query uchun 2s timeout shablonini yozing.","examples":[{"name":"time.After bilan timeout","code":"// WithDeadline va WithTimeout\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tselect{case <-time.After(15*time.Millisecond):fmt.Println(\"timeout\")}\n}\n","expected":"timeout","why":"Signal bo‘lmasa deadline o‘tganini bildiradi.","level":"Junior · Sodda"},{"name":"Contextga quloq soluvchi ish","code":"// WithDeadline va WithTimeout\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),10*time.Millisecond);defer cancel();select{case <-time.After(50*time.Millisecond):fmt.Println(\"ok\");case <-ctx.Done():fmt.Println(ctx.Err())}\n}\n","expected":"context deadline exceeded","why":"Cancelled contextni downstream ham tekshirish kerak.","level":"Middle · Real holat"},{"name":"HTTP serverning deadline bilan test","code":"// WithDeadline va WithTimeout\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n\t\"context\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n)\n\nfunc main() {\n\ts:=httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter,r *http.Request){time.Sleep(100*time.Millisecond);fmt.Fprint(w,\"ok\")}));defer s.Close();ctx,cancel:=context.WithTimeout(context.Background(),10*time.Millisecond);defer cancel()\n\treq,_:=http.NewRequestWithContext(ctx,\"GET\",s.URL,nil);resp,err:=http.DefaultClient.Do(req);if resp!=nil{resp.Body.Close()};fmt.Println(err!=nil)\n}\n","expected":"true","why":"Client requestni cancel qilishi mumkin, server tomonda side effect allaqachon bo‘lgan bo‘lishi mumkin.","level":"Senior · Murakkab"}]},{"id":"m7-t4","title":"DeadlineCause, TimeoutCause, WithoutCancel","terms":["WithDeadlineCause","WithTimeoutCause","WithoutCancel"],"theory":"DeadlineCause/TimeoutCause vaqt tugash sababini batafsil saqlaydi. WithoutCancel parent value qiymatlarini saqlab, cancel/deadlinedan ajratilgan context beradi.","risk":"WithoutCancel ishlatganda cheksiz ish qolmasligi uchun yangi timeout qo‘ying.","drill":"Background audit logni alohida timeout bilan yuboring.","examples":[{"name":"Background va value","code":"// DeadlineCause, TimeoutCause, WithoutCancel\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\ntype traceKey struct{}\n\nfunc main() {\n\tctx:=context.WithValue(context.Background(),traceKey{},\"req-7\");fmt.Println(ctx.Value(traceKey{}))\n}\n","expected":"req-7","why":"Typed private key clash ehtimolini kamaytiradi.","level":"Junior · Sodda"},{"name":"Parent cancellation childga tarqaladi","code":"// DeadlineCause, TimeoutCause, WithoutCancel\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tparent,cancel:=context.WithCancel(context.Background());child,_:=context.WithCancel(parent);cancel();<-child.Done();fmt.Println(child.Err())\n}\n","expected":"context canceled","why":"Parent bekor qilinsa child ham bekor bo‘ladi.","level":"Middle · Real holat"},{"name":"Worker lifecycle context","code":"// DeadlineCause, TimeoutCause, WithoutCancel\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),25*time.Millisecond);defer cancel();done:=make(chan struct{})\n\tgo func(){defer close(done);for{select{case <-ctx.Done():return;case <-time.After(8*time.Millisecond):fmt.Println(\"heartbeat\")}}}();<-done;fmt.Println(\"stopped\")\n}\n","expected":"heartbeat bir necha marta, stopped","why":"Cancel — signal; goroutine uni kuzatib return qilishi kerak.","level":"Senior · Murakkab"}]},{"id":"m7-t5","title":"WithValue va antipatternlar","terms":["context.WithValue","Typed key","Context anti-pattern","Goroutine leak"],"theory":"WithValue faqat request-scope metadata (trace ID) kabi ma’lumotlar uchun. `struct{}` type key collision xavfini kamaytiradi. Config/DB dependency saqlash uchun ishlatmang.","risk":"Context qiymatini request body o‘rnida ishlatmang.","drill":"Trace IDni chuqur funksiyagacha uzating.","examples":[{"name":"Background va value","code":"// WithValue va antipatternlar\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\ntype traceKey struct{}\n\nfunc main() {\n\tctx:=context.WithValue(context.Background(),traceKey{},\"req-7\");fmt.Println(ctx.Value(traceKey{}))\n}\n","expected":"req-7","why":"Typed private key clash ehtimolini kamaytiradi.","level":"Junior · Sodda"},{"name":"Parent cancellation childga tarqaladi","code":"// WithValue va antipatternlar\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tparent,cancel:=context.WithCancel(context.Background());child,_:=context.WithCancel(parent);cancel();<-child.Done();fmt.Println(child.Err())\n}\n","expected":"context canceled","why":"Parent bekor qilinsa child ham bekor bo‘ladi.","level":"Middle · Real holat"},{"name":"Worker lifecycle context","code":"// WithValue va antipatternlar\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),25*time.Millisecond);defer cancel();done:=make(chan struct{})\n\tgo func(){defer close(done);for{select{case <-ctx.Done():return;case <-time.After(8*time.Millisecond):fmt.Println(\"heartbeat\")}}}();<-done;fmt.Println(\"stopped\")\n}\n","expected":"heartbeat bir necha marta, stopped","why":"Cancel — signal; goroutine uni kuzatib return qilishi kerak.","level":"Senior · Murakkab"}]},{"id":"m7-t6","title":"Errgroup, shutdown, custom timeout","terms":["Errgroup","Graceful shutdown","Own WithTimeout implementation"],"theory":"Bir nechta dependency query xatosida birgalikda cancel qilinadi. Shutdown HTTP serverga Shutdown(ctx) yuboradi, keyin background workerlari tugatiladi. Custom timeoutda timer va done channel boshqariladi.","risk":"Cancel qilingani `Wait` qaytishini kafolatlamaydi; ishchilar Done ga quloq solishi kerak.","drill":"Server shutdown muddatini 5 soniya qilib yarating.","examples":[{"name":"Broadcast close","code":"// Errgroup, shutdown, custom timeout\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tdone:=make(chan struct{});var wg sync.WaitGroup;for i:=0;i<2;i++{wg.Add(1);go func(){defer wg.Done();<-done;fmt.Println(\"stopped\")}()};close(done);wg.Wait()\n}\n","expected":"stopped (2 marta)","why":"close(done) barcha receive kutuvchilariga signal.","level":"Junior · Sodda"},{"name":"Or signal: birinchi kelgani","code":"// Errgroup, shutdown, custom timeout\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ta,b:=make(chan struct{}),make(chan struct{});out:=make(chan struct{});go func(){select{case <-a:case <-b:};close(out)}();close(b);<-out;fmt.Println(\"one fired\")\n}\n","expected":"one fired","why":"Bir nechta signalni select orqali birlashtirish.","level":"Middle · Real holat"},{"name":"Leak-free generator with ctx","code":"// Errgroup, shutdown, custom timeout\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());out:=make(chan int);done:=make(chan struct{})\n\tgo func(){defer close(done);defer close(out);for i:=0;;i++{select{case out<-i:case <-ctx.Done():return}}}();fmt.Println(<-out);cancel();<-done;fmt.Println(\"closed\")\n}\n","expected":"0 closed","why":"Consumer to‘xtaganda upstream cancel qilinadi va worker tugashi kutiladi.","level":"Senior · Murakkab"}]},{"id":"m7-t7","title":"Memory reordering va barriers","terms":["Memory reordering","Full barrier","Read barrier","Write barrier","Acquire","Release","Happens-before"],"theory":"CPU va kompilyator mustaqil instruksiyalarni tartibini o‘zgartirishi mumkin. Lock/channel/atomic Go memory modeldagi happens-before aloqa yaratadi. Full/read/write/acquire/release apparat bariyer tushunchalari.","risk":"Oddiy `bool` flag bilan goroutinelararo signal berish race; atomic yoki channel ishlating.","drill":"Flagni `atomic.Bool` bilan xavfsiz boshqaring.","examples":[{"name":"Atomic counter","code":"// Memory reordering va barriers\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar a atomic.Int64;a.Add(1);a.Add(2);fmt.Println(a.Load())\n}\n","expected":"3","why":"Add va Load race-free.","level":"Junior · Sodda"},{"name":"CAS status transition","code":"// Memory reordering va barriers\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar state atomic.Int32;ok:=state.CompareAndSwap(0,1);again:=state.CompareAndSwap(0,1);fmt.Println(ok,again,state.Load())\n}\n","expected":"true false 1","why":"Birgina goroutine transitionni muvaffaqiyatli amalga oshiradi.","level":"Middle · Real holat"},{"name":"Atomic snapshot","code":"// Memory reordering va barriers\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Config struct{Limit int};var p atomic.Pointer[Config];p.Store(&Config{Limit:50});var wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(p.Load().Limit)}()};wg.Wait();p.Store(&Config{Limit:100});fmt.Println(\"new\",p.Load().Limit)\n}\n","expected":"50 va new 100","why":"Yangi immutable configni to‘liq yaratib, pointerga publish qiling.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"Cancel goroutineni majburan o‘ldiradimi?","options":["Ha","Yo‘q","Faqat main"],"correct":1,"reason":"Goroutine ctx.Done signaliga javob berishi kerak."},{"q":"WithValue uchun ideal data?","options":["Global DB pool","Trace ID","Secret password store"],"correct":1,"reason":"WithValue request metadata uchun."},{"q":"Go atomic ordering?","options":["Sequentially consistent","No guarantee","Only writer sees"],"correct":0,"reason":"Go memory model atomic operatsiyalariga ketma-ket izchil semantika beradi."}]},{"id":"m8","num":8,"title":"Lock-free va algoritmlar","summary":"Sharding, RCU, CAS, ABA, Treiber va Michael–Scott.","goal":"Performance-sensitive data structurelarni ongli tanlash.","homework":"WAL segmentlarini bitta leadervan replicaga uzatish.","topics":[{"id":"m8-t1","title":"Coarse vs fine-grained locking","terms":["Coarse locking","Fine-grained locking","Contention"],"theory":"Coarse locking butun strukturani bitta lock bilan himoya qiladi. Fine-grained har bo‘lakni alohida himoya qiladi. Fine usul throughput oshirishi mumkin, ammo deadlock/complexity ko‘payadi.","risk":"Ko‘p mutex = har doim tez degani emas.","drill":"Global mutex va 8 ta shardni benchmarklang.","examples":[{"name":"Read lock","code":"// Coarse vs fine-grained locking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.RWMutex;n:=5;mu.RLock();fmt.Println(n);mu.RUnlock()\n}\n","expected":"5","why":"RLock o‘qishga ruxsat beradi.","level":"Junior · Sodda"},{"name":"Ko‘p reader","code":"// Coarse vs fine-grained locking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tvar mu sync.RWMutex;n:=42;var wg sync.WaitGroup;for i:=0;i<5;i++{wg.Add(1);go func(){defer wg.Done();mu.RLock();fmt.Println(n);mu.RUnlock()}()};wg.Wait()\n}\n","expected":"42 (5 marta)","why":"Readerlar o‘zaro to‘smasligi mumkin.","level":"Middle · Real holat"},{"name":"Read-heavy cache","code":"// Coarse vs fine-grained locking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype SafeCache struct{mu sync.RWMutex;data map[string]string}\nfunc(c *SafeCache)Get(k string)string{c.mu.RLock();defer c.mu.RUnlock();return c.data[k]}\nfunc(c *SafeCache)Set(k,v string){c.mu.Lock();defer c.mu.Unlock();c.data[k]=v}\n\nfunc main() {\n\tc:=&SafeCache{data:map[string]string{}};c.Set(\"user:1\",\"Ali\");var wg sync.WaitGroup;for i:=0;i<10;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(c.Get(\"user:1\"))}()};wg.Wait()\n}\n","expected":"Ali (10 marta)","why":"Cache mapdan o‘qish RLock, yozish Lock ostida.","level":"Senior · Murakkab"}]},{"id":"m8-t2","title":"Sharding structures","terms":["Sharding","Hash(key)","Independent locks"],"theory":"Key hash bo‘yicha shardga tushadi, har shard o‘z map va mutexiga ega. Different keylar turli locklarda parallel ishlashi mumkin.","risk":"Hot key bitta shardni band qilib qo‘yishi mumkin.","drill":"16 shardli key-value map yozing.","examples":[{"name":"Hash orqali shard indeksi","code":"// Sharding structures\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tkey:=\"news:123\";var h uint32;for _,c:=range key{h=h*31+uint32(c)};fmt.Println(int(h%8))\n}\n","expected":"0..7","why":"Bir key doimo bir xil shardga tushadi.","level":"Junior · Sodda"},{"name":"Sharded counter","code":"// Sharding structures\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tshards:=make([]atomic.Int64,4);var wg sync.WaitGroup;for i:=0;i<100;i++{wg.Add(1);go func(i int){defer wg.Done();shards[i%4].Add(1)}(i)};wg.Wait();sum:=int64(0);for i:=range shards{sum+=shards[i].Load()};fmt.Println(sum)\n}\n","expected":"100","why":"Mustaqil counterlar umumiy bitta atomic nuqtadan contentionni kamaytirishi mumkin.","level":"Middle · Real holat"},{"name":"16 shardli map","code":"// Sharding structures\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype Shard struct{mu sync.RWMutex; data map[string]int}\ntype Sharded struct{parts []Shard}\nfunc NewSharded(n int)*Sharded{s:=&Sharded{parts:make([]Shard,n)};for i:=range s.parts{s.parts[i].data=map[string]int{}};return s}\nfunc(s *Sharded)index(k string)int{h:=uint32(2166136261);for i:=0;i<len(k);i++{h^=uint32(k[i]);h*=16777619};return int(h%uint32(len(s.parts)))}\nfunc(s *Sharded)Set(k string,v int){p:=&s.parts[s.index(k)];p.mu.Lock();p.data[k]=v;p.mu.Unlock()}\nfunc(s *Sharded)Get(k string)int{p:=&s.parts[s.index(k)];p.mu.RLock();v:=p.data[k];p.mu.RUnlock();return v}\n\nfunc main() {\n\ts:=NewSharded(16);var wg sync.WaitGroup;for i:=0;i<100;i++{wg.Add(1);go func(i int){defer wg.Done();s.Set(fmt.Sprint(i),i)}(i)};wg.Wait();fmt.Println(s.Get(\"5\"))\n}\n","expected":"5","why":"Har shard mutexli mapga ega, keyni hash shu shardga yo‘naltiradi.","level":"Senior · Murakkab"}]},{"id":"m8-t3","title":"Optimistic concurrency va CAS","terms":["Optimistic locking","Version","CAS","Retry"],"theory":"Avval versiya/qiymat o‘qiladi, yangilash oldingi holat o‘zgarmagan bo‘lsa qabul qilinadi. Conflict bo‘lsa qayta uriniladi.","risk":"CAS loopda backoff va maksimum retry haqida o‘ylang.","drill":"Statusni NEW→PROCESSING faqat bir marta o‘tkazing.","examples":[{"name":"Atomic counter","code":"// Optimistic concurrency va CAS\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar a atomic.Int64;a.Add(1);a.Add(2);fmt.Println(a.Load())\n}\n","expected":"3","why":"Add va Load race-free.","level":"Junior · Sodda"},{"name":"CAS status transition","code":"// Optimistic concurrency va CAS\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar state atomic.Int32;ok:=state.CompareAndSwap(0,1);again:=state.CompareAndSwap(0,1);fmt.Println(ok,again,state.Load())\n}\n","expected":"true false 1","why":"Birgina goroutine transitionni muvaffaqiyatli amalga oshiradi.","level":"Middle · Real holat"},{"name":"Atomic snapshot","code":"// Optimistic concurrency va CAS\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Config struct{Limit int};var p atomic.Pointer[Config];p.Store(&Config{Limit:50});var wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(){defer wg.Done();fmt.Println(p.Load().Limit)}()};wg.Wait();p.Store(&Config{Limit:100});fmt.Println(\"new\",p.Load().Limit)\n}\n","expected":"50 va new 100","why":"Yangi immutable configni to‘liq yaratib, pointerga publish qiling.","level":"Senior · Murakkab"}]},{"id":"m8-t4","title":"RCU va immutable snapshot","terms":["RCU","Read-Copy-Update","Atomic pointer","Immutable state"],"theory":"Readerlar o‘zgarmas snapshotni oladi. Writer yangi nusxa yaratib pointerga atomik publish qiladi. Read-heavy konfiguratsiyada qulay.","risk":"Snapshot publish qilgandan keyin ichki map/sliceni mutatsiya qilmang.","drill":"Configni reload qilganda readers bloklanmasin.","examples":[{"name":"Immutable config","code":"// RCU va immutable snapshot\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Config struct{Limit int};c:=Config{Limit:10};fmt.Println(c.Limit)\n}\n","expected":"10","why":"Read-only qiymatni concurrent o‘qish xavfsiz.","level":"Junior · Sodda"},{"name":"Atomic pointer publish","code":"// RCU va immutable snapshot\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Config struct{Limit int};var current atomic.Pointer[Config];current.Store(&Config{Limit:10});current.Store(&Config{Limit:20});fmt.Println(current.Load().Limit)\n}\n","expected":"20","why":"Yangi obyekt yaratib pointer almashtiriladi.","level":"Middle · Real holat"},{"name":"Snapshot map copy-on-write","code":"// RCU va immutable snapshot\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Data struct{Users map[string]int};var p atomic.Pointer[Data];p.Store(&Data{Users:map[string]int{\"a\":1}});old:=p.Load();fresh:=make(map[string]int,len(old.Users)+1);for k,v:=range old.Users{fresh[k]=v};fresh[\"b\"]=2;p.Store(&Data{Users:fresh});fmt.Println(p.Load().Users[\"b\"])\n}\n","expected":"2","why":"Oldingi map mutatsiya qilinmadi; o‘quvchilar immutable snapshotni ko‘radi.","level":"Senior · Murakkab"}]},{"id":"m8-t5","title":"Treiber stack va nonblocking","terms":["Lock-free","Treiber Stack","Head CAS"],"theory":"Treiber stack linked node head pointerini CAS bilan yangilaydi. Bir urinishda boshqasi headni o‘zgartirsa qayta urinadi.","risk":"Nil, ABA va memory reclamationni tushunmasdan low-level algoritmni productionga qo‘ymang.","drill":"CAS bilan concurrent push/pop ustida test yozing.","examples":[{"name":"Oddiy LIFO","code":"// Treiber stack va nonblocking\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tstack:=[]int{1,2,3};v:=stack[len(stack)-1];stack=stack[:len(stack)-1];fmt.Println(v,stack)\n}\n","expected":"3 [1 2]","why":"LIFO oxirgi qo‘shilganni birinchi oladi.","level":"Junior · Sodda"},{"name":"Mutexli concurrent stack","code":"// Treiber stack va nonblocking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\ntype SafeStack struct{mu sync.Mutex;data []int}\nfunc(s *SafeStack)Push(v int){s.mu.Lock();s.data=append(s.data,v);s.mu.Unlock()}\nfunc(s *SafeStack)Pop()(int,bool){s.mu.Lock();defer s.mu.Unlock();if len(s.data)==0{return 0,false};i:=len(s.data)-1;v:=s.data[i];s.data=s.data[:i];return v,true}\n\nfunc main() {\n\ts:=&SafeStack{};var wg sync.WaitGroup;for i:=0;i<3;i++{wg.Add(1);go func(i int){defer wg.Done();s.Push(i)}(i)};wg.Wait();fmt.Println(s.Pop())\n}\n","expected":"0..2, true","why":"Oddiy mutex stack uchun tez-tez eng ma’qul.","level":"Middle · Real holat"},{"name":"Treiber CAS stack","code":"// Treiber stack va nonblocking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\ntype Node struct{v int;next *Node}\ntype LockFreeStack struct{head atomic.Pointer[Node]}\nfunc(s *LockFreeStack)Push(v int){n:=&Node{v:v};for{old:=s.head.Load();n.next=old;if s.head.CompareAndSwap(old,n){return}}}\nfunc(s *LockFreeStack)Pop()(int,bool){for{old:=s.head.Load();if old==nil{return 0,false};if s.head.CompareAndSwap(old,old.next){return old.v,true}}}\n\nfunc main() {\n\ts:=&LockFreeStack{};s.Push(10);s.Push(20);v,ok:=s.Pop();fmt.Println(v,ok)\n}\n","expected":"20 true","why":"Head pointer atomik CAS bilan almashadi. Go GC node lifetimega yordam beradi, lekin ABA risklarini baribir baholang.","level":"Senior · Murakkab"}]},{"id":"m8-t6","title":"Michael-Scott queue","terms":["Michael–Scott Queue","FIFO","Head/tail CAS","Sentinel"],"theory":"M&S queue nonblocking linked FIFO queue bo‘lib, sentinel va head/tail atomik updatega tayangan. Kod murakkab, lekin lock-free queue konsepsiyasi uchun standart misol.","risk":"Oddiy channel yoki mutex-protected queue ko‘p vaziyatda afzal.","drill":"Producer va consumer uchun FIFO invariantini sinang.","examples":[{"name":"Oddiy FIFO","code":"// Michael-Scott queue\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tq:=[]int{1,2,3};first:=q[0];q=q[1:];fmt.Println(first,q)\n}\n","expected":"1 [2 3]","why":"FIFO avval kiritilgan element avval chiqadi.","level":"Junior · Sodda"},{"name":"Channel FIFO","code":"// Michael-Scott queue\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tq:=make(chan int,3);q<-1;q<-2;q<-3;fmt.Println(<-q,<-q,<-q)\n}\n","expected":"1 2 3","why":"Channel bir producer tomonidan yuborilgan qiymatlarning tartibini saqlaydi.","level":"Middle · Real holat"},{"name":"Michael–Scott CAS queue","code":"// Michael-Scott queue\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\ntype MSNode struct{val int;next atomic.Pointer[MSNode]}\ntype MSQueue struct{head,tail atomic.Pointer[MSNode]}\nfunc NewMSQueue()*MSQueue{q:=&MSQueue{};d:=&MSNode{};q.head.Store(d);q.tail.Store(d);return q}\nfunc(q *MSQueue)Enqueue(v int){n:=&MSNode{val:v};for{t:=q.tail.Load();next:=t.next.Load();if t!=q.tail.Load(){continue};if next==nil{if t.next.CompareAndSwap(nil,n){q.tail.CompareAndSwap(t,n);return}}else{q.tail.CompareAndSwap(t,next)}}}\nfunc(q *MSQueue)Dequeue()(int,bool){for{h:=q.head.Load();t:=q.tail.Load();next:=h.next.Load();if h!=q.head.Load(){continue};if next==nil{return 0,false};if h==t{q.tail.CompareAndSwap(t,next);continue};v:=next.val;if q.head.CompareAndSwap(h,next){return v,true}}}\n\nfunc main() {\n\tq:=NewMSQueue();q.Enqueue(10);q.Enqueue(20);x,ok:=q.Dequeue();fmt.Println(x,ok)\n}\n","expected":"10 true","why":"Sentinel head/tail va next pointer CAS bilan harakat qiladi; bu dars demonstratsiyasi.","level":"Senior · Murakkab"}]},{"id":"m8-t7","title":"ABA, tagged pointer, hazard pointer","terms":["ABA problem","Tagged pointer","Hazard pointer","Memory reclamation"],"theory":"A→B→A holatida CAS o‘zgarishni payqamaydi. Tagged pointer versiyani ham solishtiradi. Hazard pointers chiqarib tashlangan obyektni hali o‘qiyotganlar uchun himoya qiladi.","risk":"Go GC memory reclamationni yengillashtiradi, ammo mantiqiy ABA qolishi mumkin.","drill":"Pointerdan tashqari version raqami qanday foyda berishini yozing.","examples":[{"name":"ABA ssenariysi","code":"// ABA, tagged pointer, hazard pointer\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tstate:=\"A\";state=\"B\";state=\"A\";fmt.Println(state)\n}\n","expected":"A","why":"Faqat A ga qarab B oraliq holatni aniqlab bo‘lmaydi.","level":"Junior · Sodda"},{"name":"Version bilan ajratish","code":"// ABA, tagged pointer, hazard pointer\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Versioned struct{Value string;Version uint64};s:=Versioned{Value:\"A\",Version:1};s=Versioned{Value:\"B\",Version:2};s=Versioned{Value:\"A\",Version:3};fmt.Println(s)\n}\n","expected":"{A 3}","why":"Version o‘zgarishni ko‘rsatadi, state A bo‘lsa ham.","level":"Middle · Real holat"},{"name":"Atomik versionli state","code":"// ABA, tagged pointer, hazard pointer\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tvar version atomic.Uint64;var state atomic.Int32;version.Add(1);state.Store(1);version.Add(1);state.Store(0);fmt.Println(state.Load(),version.Load())\n}\n","expected":"0 2","why":"Bu ikki atomic field birgalikda atomik snapshot emas; composite CAS talab qilinishi mumkin.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"RCU writer qanday yangilaydi?","options":["Oldini joyida mutatsiya qiladi","Yangi immutable snapshot publish","Barcha readerni o‘ldiradi"],"correct":1,"reason":"Yangi snapshot pointer atomik almashtiriladi."},{"q":"ABA nima?","options":["A→B→A ko‘rinishdagi oraliq o‘zgarish","Server crash","Cache hit"],"correct":0,"reason":"CAS aynan bir xil qiymatga qaytishni payqamay qolishi mumkin."},{"q":"Lock-free har G kutmasligi kafolatimi?","options":["Ha","Yo‘q","Faqat 1 coreda"],"correct":1,"reason":"Tizim bo‘yicha progress talabi, per-thread wait-free emas."}]},{"id":"m9","num":9,"title":"Concurrent computation va DB","summary":"2PL/MVCC, isolation, Amdahl, actor.","goal":"Concurrent DB va web serverni ishonchli qurish.","homework":"Leader→replica WAL ketma-ketligini tekshirish.","topics":[{"id":"m9-t1","title":"2PL transaction locking","terms":["2PL","Two-phase locking","Shared/Exclusive locks"],"theory":"2PLda transaction lock olish bosqichi va lock bo‘shatish bosqichidan o‘tadi. Konfliktlar tartibini boshqarishga yordam beradi. Strict 2PLda yozish locklari commitgacha saqlanadi.","risk":"Lock order noto‘g‘ri bo‘lsa DB deadlock qiladi.","drill":"Bank transferida ikki accountni barqaror tartibda locklang.","examples":[{"name":"Atomic update g‘oyasi","code":"// 2PL transaction locking\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tbalance:=100;debit:=20;if balance>=debit{balance-=debit};fmt.Println(balance)\n}\n","expected":"80","why":"Bitta processdagi bu oddiy misol DB transaction o‘rnini bosmaydi.","level":"Junior · Sodda"},{"name":"Rollback modelini tushunish","code":"// 2PL transaction locking\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\toldA,oldB:=100,50;a,b:=oldA,oldB;amount:=20;if a>=amount{a-=amount;b+=amount};fmt.Println(a,b)\n}\n","expected":"80 70","why":"Ikkala o‘zgarish atomik commit qilinishi kerak.","level":"Middle · Real holat"},{"name":"DB transaction pseudocode bilan retry mexanizmi","code":"// 2PL transaction locking\npackage main\n\nimport (\n\t\"fmt\"\n\t\"errors\"\n)\n\nfunc simulateTransfer(attempt int)error{if attempt==1{return errors.New(\"serialization failure\")};return nil}\n\nfunc main() {\n\tattempt:=0;for{attempt++;err:=simulateTransfer(attempt);if err==nil{fmt.Println(\"committed\",attempt);break};if attempt>=3{fmt.Println(\"failed\",err);break}}\n}\n","expected":"committed 2","why":"Haqiqiy PostgreSQLda sql.Tx va SQLSTATE 40001 uchun bounded retry ishlatish kerak.","level":"Senior · Murakkab"}]},{"id":"m9-t2","title":"MVCC va snapshot isolation","terms":["MVCC","Snapshot","Versions","Vacuum"],"theory":"MVCC yozilgan ma’lumotning bir nechta versiyasini saqlab, readerga tegishli snapshotni beradi. PostgreSQL concurrent transactional workloadlarda MVCCdan foydalanadi.","risk":"MVCC hamma conflictni yo‘qotmaydi; write skew va isolation darajalari muhim.","drill":"READ COMMITTED va REPEATABLE READ natijasini taqqoslang.","examples":[{"name":"Snapshot copy","code":"// MVCC va snapshot isolation\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tsource:=map[string]int{\"stock\":10};snapshot:=map[string]int{\"stock\":source[\"stock\"]};source[\"stock\"]=5;fmt.Println(snapshot[\"stock\"],source[\"stock\"])\n}\n","expected":"10 5","why":"Snapshot eski versiyani o‘qish fikrini ko‘rsatadi; bu haqiqiy DB MVCC emas.","level":"Junior · Sodda"},{"name":"Versionli tarix","code":"// MVCC va snapshot isolation\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Version struct{TX int;Value int};history:=[]Version{{1,10},{2,7},{3,5}};readTX:=2;value:=0;for _,v:=range history{if v.TX<=readTX{value=v.Value}};fmt.Println(value)\n}\n","expected":"7","why":"O‘quvchi ko‘rishi mumkin bo‘lgan eng oxirgi versiya tanlanmoqda (soddalashtirilgan model).","level":"Middle · Real holat"},{"name":"Concurrent snapshot read","code":"// MVCC va snapshot isolation\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\ttype Snapshot struct{Version int;Price int};var p atomic.Pointer[Snapshot];p.Store(&Snapshot{Version:1,Price:100});old:=p.Load();p.Store(&Snapshot{Version:2,Price:120});fmt.Println(\"old\",old.Price,\"new\",p.Load().Price)\n}\n","expected":"old 100 new 120","why":"Immutable snapshotlar parallel o‘qish uchun qulay; PostgreSQL MVCC undan murakkabroq.","level":"Senior · Murakkab"}]},{"id":"m9-t3","title":"Serializability va retry","terms":["Serializability","Write skew","Isolation","Retry"],"theory":"Serializable isolation concurrent transaksiyalar natijasi qandaydir serial tartibga mos kelishini talab qiladi. Conflict bo‘lsa DB bittasini abort qilishi va retry talab etishi mumkin.","risk":"Transaction retryda tashqi email/payment side effectni takrorlab yubormang.","drill":"Serialization failure bo‘lsa bounded retry algoritmini loyihalang.","examples":[{"name":"Atomic update g‘oyasi","code":"// Serializability va retry\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tbalance:=100;debit:=20;if balance>=debit{balance-=debit};fmt.Println(balance)\n}\n","expected":"80","why":"Bitta processdagi bu oddiy misol DB transaction o‘rnini bosmaydi.","level":"Junior · Sodda"},{"name":"Rollback modelini tushunish","code":"// Serializability va retry\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\toldA,oldB:=100,50;a,b:=oldA,oldB;amount:=20;if a>=amount{a-=amount;b+=amount};fmt.Println(a,b)\n}\n","expected":"80 70","why":"Ikkala o‘zgarish atomik commit qilinishi kerak.","level":"Middle · Real holat"},{"name":"DB transaction pseudocode bilan retry mexanizmi","code":"// Serializability va retry\npackage main\n\nimport (\n\t\"fmt\"\n\t\"errors\"\n)\n\nfunc simulateTransfer(attempt int)error{if attempt==1{return errors.New(\"serialization failure\")};return nil}\n\nfunc main() {\n\tattempt:=0;for{attempt++;err:=simulateTransfer(attempt);if err==nil{fmt.Println(\"committed\",attempt);break};if attempt>=3{fmt.Println(\"failed\",err);break}}\n}\n","expected":"committed 2","why":"Haqiqiy PostgreSQLda sql.Tx va SQLSTATE 40001 uchun bounded retry ishlatish kerak.","level":"Senior · Murakkab"}]},{"id":"m9-t4","title":"Amdahl law va benchmark","terms":["Amdahl law","Parallel fraction","Scalability","Bottleneck"],"theory":"Parallel bo‘lmaydigan qism umumiy tezlashish chegarasini qo‘yadi: S(N)=1/((1-P)+P/N). CPU-bound ishni ko‘p goroutinega bo‘lish overhead keltirishi mumkin.","risk":"RPS faqat CPUga bog‘liq emas: DB, network, contention bottleneck bo‘lishi mumkin.","drill":"1, 2, 4, 8 workerni bir xil workload bilan solishtiring.","examples":[{"name":"Vaqt o‘lchash","code":"// Amdahl law va benchmark\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tstart:=time.Now(); total:=0;for i:=0;i<100000;i++ { total+=i }; fmt.Println(total, time.Since(start))\n}\n","expected":"","why":"Vaqt muhitga bog‘liq; optimizatsiyada haqiqiy benchmark kerak.","level":"Junior · Sodda"},{"name":"Parallel sum","code":"// Amdahl law va benchmark\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tnums:=make([]int,100000);for i:=range nums { nums[i]=i }\n\tstart:=time.Now();half:=len(nums)/2;result:=make(chan int,2)\n\tfor _,part:=range [][]int{nums[:half],nums[half:]} { go func(p []int){ s:=0;for _,n:=range p{s+=n};result<-s }(part) }\n\tfmt.Println(<-result+<-result, time.Since(start))\n}\n","expected":"","why":"Bo‘lib hisoblash overhead bilan keladi; kichik ishda sekinlashishi mumkin.","level":"Middle · Real holat"},{"name":"Benchmarkga tayyor test shabloni","code":"// Amdahl law va benchmark\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tstart:=time.Now();var total atomic.Int64;var wg sync.WaitGroup\n\tfor w:=0;w<4;w++ { wg.Add(1);go func(){defer wg.Done();for i:=0;i<10000;i++ {total.Add(1)}}()};wg.Wait()\n\tfmt.Println(\"operations:\",total.Load(),\"elapsed:\",time.Since(start))\n}\n","expected":"operations: 40000","why":"Bu microbenchmark ko‘rinishi; real natija uchun go test -bench va pprof ishlating.","level":"Senior · Murakkab"}]},{"id":"m9-t5","title":"Actor model va web server","terms":["Actor model","Mailbox","Web server architecture","State ownership"],"theory":"Actor statega faqat o‘zi murojaat qiladi, boshqalar mail boxga xabar yuboradi. HTTP server esa requestlarni concurrent ishlatadi; stateni lock yoki aktorga topshirish mumkin.","risk":"Actor bottleneckga aylanishi yoki mailbox cheksiz o‘sishi mumkin.","drill":"Chat-room actor uchun send/join/leave commands yarating.","examples":[{"name":"Mailboxdan xabar olish","code":"// Actor model va web server\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tmailbox:=make(chan int,1);mailbox<-5;fmt.Println(<-mailbox)\n}\n","expected":"5","why":"Actorning kirish yo‘li — xabar navbati.","level":"Junior · Sodda"},{"name":"Actor counter","code":"// Actor model va web server\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Cmd struct{Delta int;Reply chan int};mailbox:=make(chan Cmd);go func(){balance:=0;for c:=range mailbox{balance+=c.Delta;c.Reply<-balance}}();reply:=make(chan int);mailbox<-Cmd{Delta:10,Reply:reply};fmt.Println(<-reply);close(mailbox)\n}\n","expected":"10","why":"State faqat actor goroutine ichida o‘zgaradi.","level":"Middle · Real holat"},{"name":"Bounded mailbox + cancellation","code":"// Actor model va web server\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());inbox:=make(chan string,2);done:=make(chan struct{});go func(){defer close(done);for{select{case m:=<-inbox:fmt.Println(m);case <-ctx.Done():return}}}();inbox<-\"join\";time.Sleep(time.Millisecond);cancel();<-done\n}\n","expected":"join","why":"Buffered mailbox o‘lchami va shutdown qoidasini aniq belgilang.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"MVCC nima uchun?","options":["Satr versiyalarini boshqarish","Goroutine ID","File compression"],"correct":0,"reason":"Reader snapshotga mos versiyani o‘qishi mumkin."},{"q":"Serializable conflict bo‘lsa?","options":["Retry kerak bo‘lishi mumkin","Doim muvaffaqiyat","GC o‘chadi"],"correct":0,"reason":"DB transaction abort/retry talab etishi mumkin."},{"q":"Amdahl qonuni nimani cheklaydi?","options":["Parallel tezlashishni","TLSni","RAM hajmini"],"correct":0,"reason":"Serial ulush maksimal speedupni cheklaydi."}]},{"id":"m10","num":10,"title":"Production amaliyoti","summary":"Worker pool, cache sync, scheduler, batcher.","goal":"Oldingi bilimlarni production backend patternlariga birlashtirish.","homework":"WAL va asinxron replikatsiyali key–value DBni yakunlash.","topics":[{"id":"m10-t1","title":"Worker pool va backpressure","terms":["Worker pool","Bounded workers","Backpressure","Retry"],"theory":"Worker pool concurrent ish sonini cheklaydi, buffered queue oraliq yukni yutadi, to‘lsa producer kutadi. Retry va shutdown alohida mas’uliyatdir.","risk":"Worker countni nafaqat CPU soniga, balki I/O latency va limitlarga moslang.","drill":"Email queue uchun 4 worker, timeout va error accounting yozing.","examples":[{"name":"Bitta worker","code":"// Worker pool va backpressure\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tjobs:=make(chan int,3);for i:=1;i<=3;i++{jobs<-i};close(jobs);for n:=range jobs{fmt.Println(\"job\",n)}\n}\n","expected":"job 1..3","why":"Consumer queue bo‘shaguncha ishlaydi.","level":"Junior · Sodda"},{"name":"4 worker bilan queue","code":"// Worker pool va backpressure\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\tjobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<4;w++{wg.Add(1);go func(){defer wg.Done();for id:=range jobs{fmt.Println(\"done\",id)}}()};for id:=1;id<=12;id++{jobs<-id};close(jobs);wg.Wait()\n}\n","expected":"12 ta done","why":"Bounded worker pool konkurent ish sonini cheklaydi.","level":"Middle · Real holat"},{"name":"Contextli worker pool","code":"// Worker pool va backpressure\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"context\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithCancel(context.Background());jobs:=make(chan int);var wg sync.WaitGroup;for w:=0;w<3;w++{wg.Add(1);go func(){defer wg.Done();for{select{case <-ctx.Done():return;case j,ok:=<-jobs:if !ok{return};fmt.Println(\"job\",j)}}}()};for i:=0;i<5;i++{jobs<-i};close(jobs);wg.Wait();cancel()\n}\n","expected":"5 ta job","why":"Kanalni yopish va context cancellation ikkita lifecycle vositasi.","level":"Senior · Murakkab"}]},{"id":"m10-t2","title":"Cache synchronizer","terms":["Cache synchronizer","Invalidation","Pub/Sub","Version","TTL"],"theory":"Bir nechta server cachelarini yangilash uchun invalidation eventlari yoki versionlardan foydalaniladi. TTL eski ma’lumotni chegaralaydi, lekin qat’iy izchillik bermaydi.","risk":"Bitta process Mutex uchta node cachelarini sinxronlashtirmaydi.","drill":"Yangilanish eventini 3 replica cachega yoying.","examples":[{"name":"Cache invalidation","code":"// Cache synchronizer\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tcache:=map[string]string{\"item:1\":\"old\"};delete(cache,\"item:1\");fmt.Println(len(cache))\n}\n","expected":"0","why":"O‘zgargan key cache dan olib tashlanadi.","level":"Junior · Sodda"},{"name":"Version bilan event","code":"// Cache synchronizer\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ttype Event struct{Key string;Version int};current:=map[string]int{\"p:1\":2};e:=Event{Key:\"p:1\",Version:3};if e.Version>current[e.Key]{current[e.Key]=e.Version};fmt.Println(current[e.Key])\n}\n","expected":"3","why":"Kechikib kelgan eski event yangi qiymatni ustidan yozmasin.","level":"Middle · Real holat"},{"name":"3 replica in-process invalidation","code":"// Cache synchronizer\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n)\n\nfunc main() {\n\ttype Cache struct{mu sync.Mutex;data map[string]int};caches:=make([]*Cache,3);for i:=range caches{caches[i]=&Cache{data:map[string]int{\"x\":1}}};var wg sync.WaitGroup;for _,c:=range caches{wg.Add(1);go func(c *Cache){defer wg.Done();c.mu.Lock();delete(c.data,\"x\");c.mu.Unlock()}(c)};wg.Wait();fmt.Println(\"invalidated\",len(caches))\n}\n","expected":"invalidated 3","why":"Bu faqat bitta process simulyatsiyasi; haqiqiy multi-node uchun broker, DB yoki messaging kerak.","level":"Senior · Murakkab"}]},{"id":"m10-t3","title":"Scheduler va interval jobs","terms":["Scheduler","Periodic jobs","Ticker","Overlap","Leader election"],"theory":"Scheduler davriy ishni ishga tushiradi. Oldingi ish tugamagan bo‘lsa overlap siyosati kerak. Ko‘p instance o‘rtasida takroriy ishni oldini olish uchun distributed coordination qo‘llanadi.","risk":"Ticker missed ticklarni yig‘ib navbatga qo‘ymaydi; cron delivery semantikasi alohida.","drill":"Har 5 minutlik ish uchun no-overlap lock va shutdown qiling.","examples":[{"name":"Periodik ish","code":"// Scheduler va interval jobs\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\ttick:=time.NewTicker(10*time.Millisecond);defer tick.Stop();for i:=0;i<2;i++{<-tick.C;fmt.Println(\"run\",i)}\n}\n","expected":"run 0,1","why":"Ticker davriy schedulerning sodda mexanizmi.","level":"Junior · Sodda"},{"name":"Overlap oldini olish","code":"// Scheduler va interval jobs\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tbusy:=make(chan struct{},1);busy<-struct{}{};for i:=0;i<3;i++{select{case <-busy:fmt.Println(\"start\",i);busy<-struct{}{};default:fmt.Println(\"skip\")}}\n}\n","expected":"start 0,1,2","why":"Token ish bandligini boshqaradi; real uzoq task uchun lock lifecycle tuzing.","level":"Middle · Real holat"},{"name":"Cancellationli no-overlap scheduler","code":"// Scheduler va interval jobs\npackage main\n\nimport (\n\t\"fmt\"\n\t\"context\"\n\t\"time\"\n\t\"sync\"\n\t\"sync/atomic\"\n)\n\nfunc main() {\n\tctx,cancel:=context.WithTimeout(context.Background(),35*time.Millisecond);defer cancel();tick:=time.NewTicker(10*time.Millisecond);defer tick.Stop();var running atomic.Bool;var wg sync.WaitGroup\n\tfor loop:=true;loop;{select{case <-tick.C:if !running.CompareAndSwap(false,true){continue};wg.Add(1);go func(){defer wg.Done();defer running.Store(false);time.Sleep(15*time.Millisecond);fmt.Println(\"job done\")}();case <-ctx.Done():loop=false}};wg.Wait()\n}\n","expected":"job done bir necha marta","why":"Oldingi ish tugamagan bo‘lsa yangi task skip qilinadi; shutdown ichki ishni kutadi.","level":"Senior · Murakkab"}]},{"id":"m10-t4","title":"Batcher va WAL flush","terms":["Batcher","Batch size","Flush interval","Durability","Idempotency"],"theory":"Batcher n ta kichik write ni bitta I/O operatsiyaga yig‘adi. Max batch size yoki interval yetganda flush bo‘ladi. WAL/logda fsync va recovery durabilityga ta’sir qiladi.","risk":"In-memory batch process crashida yo‘qoladi; durable queue, retry va idempotency kerak.","drill":"Redis view counterlarni Postgresga har 2 minutda xavfsizroq flush qiling.","examples":[{"name":"3 tadan batchga yig‘ish","code":"// Batcher va WAL flush\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tbatch:=[]int{};for i:=1;i<=7;i++{batch=append(batch,i);if len(batch)==3{fmt.Println(\"flush\",batch);batch=nil}};if len(batch)>0{fmt.Println(\"flush\",batch)}\n}\n","expected":"3,3,1 guruhlar","why":"Max batch size to‘lganda flush.","level":"Junior · Sodda"},{"name":"Size yoki timerga qarab flush","code":"// Batcher va WAL flush\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc main() {\n\tinput:=make(chan int,5);for i:=0;i<5;i++{input<-i};close(input);batch:=[]int{};ticker:=time.NewTicker(20*time.Millisecond);defer ticker.Stop()\n\tfor input!=nil{select{case v,ok:=<-input:if !ok{input=nil;break};batch=append(batch,v);if len(batch)>=3{fmt.Println(\"flush\",batch);batch=nil};case <-ticker.C:if len(batch)>0{fmt.Println(\"flush\",batch);batch=nil}}};if len(batch)>0{fmt.Println(\"final\",batch)}\n}\n","expected":"3 + 2 elementli guruh","why":"Sikldan chiqishdan oldin qoldiq batch flush bo‘ladi.","level":"Middle · Real holat"},{"name":"Per-ID count aggregation","code":"// Batcher va WAL flush\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sort\"\n)\n\nfunc main() {\n\tcounts:=map[int64]int64{};views:=[]int64{3,3,8,3,8,9};for _,id:=range views{counts[id]++};ids:=make([]int64,0,len(counts));for id:=range counts{ids=append(ids,id)};sort.Slice(ids,func(i,j int)bool{return ids[i]<ids[j]});for _,id:=range ids{fmt.Printf(\"UPDATE news SET views=views+%d WHERE id=%d;\\n\",counts[id],id)}\n}\n","expected":"3:3 ta, 8:2 ta, 9:1 ta","why":"Productionda bitta parameterized batch query/transaction, idempotency va retry talab qilinadi.","level":"Senior · Murakkab"}]}],"quiz":[{"q":"Worker pool nima qiladi?","options":["Cheklangan workerlar bilan ishlaydi","Hammani parallel ochadi","Yagona thread"],"correct":0,"reason":"Parallelizm limit va backpressure orqali boshqariladi."},{"q":"Batcher nima uchun?","options":["I/O operationlarni guruhlash","CPU cache o‘chirish","Redis backup"],"correct":0,"reason":"Ko‘p yozuvni bir batchga birlashtirish mumkin."},{"q":"Bir nechta serverda cron duplicate xavfi?","options":["Yo‘q","Ha, koordinatsiya kerak","Faqat GOMAXPROCS=1"],"correct":1,"reason":"Distributed lock/leader yoki idempotency talab etiladi."}]}],"defs":{"processor":"CPU dastur instruktsiyalarini ketma-ket yoki parallel resurslarda bajaradigan hisoblash qurilmasi.","bus":"Komponentlar o‘rtasida signal va ma’lumot yetkazadigan aloqa kanali.","data path":"Registr, ALU va boshqa bloklar bo‘ylab ma’lumot harakatlanadigan hisoblash yo‘li.","register":"CPU ichidagi juda tezkor, kichik xotira joyi.","alu":"Arifmetik va mantiqiy amallarni bajaruvchi CPU bloki.","instruction pipeline":"Instruksiyalarning fetch/decode/execute kabi bosqichlarini ustma-ust olib borish.","hyper-threading":"Intel ishlatadigan SMT texnologiyasining nomi; bitta fizik core bir nechta apparat threadga ega.","smt":"Simultaneous Multithreading — bir core bir nechta hardware thread kontekstiga ishlov berishi.","moore law":"Tranzistorlar zichligi o‘sishi haqidagi tarixiy empirik kuzatuv; tezlikka to‘g‘ridan-to‘g‘ri kafolat emas.","simd":"Single Instruction Multiple Data — bir buyruq bilan bir nechta qiymat ustida amal bajarish.","vectorization":"Element-wise hisoblarni SIMDga mos vektor operatsiyalariga aylantirish.","cache locality":"Bir-biriga yaqin yoki qayta ishlatiladigan xotira adreslaridan foydalanib cache hitni oshirish.","virtual memory":"Har processga katta, mustaqil address space illyuziyasini beradigan OS/MMU mexanizmi.","mmu":"Memory Management Unit — virtual manzillarni fizik manzillarga tarjima qiladigan apparat.","tlb":"Translation Loo
