zm.","token bucket":"Ma’lum tezlikda token to‘ldirib, cheklangan burstga ruxsat beradigan algoritm.","singleflight":"Bir key uchun ayni paytdagi bir necha ishni bitta bajarishga yig‘ish.","request coalescing":"Takroriy bir xil requestlarni bir computationga birlashtirish.","barrier":"Barcha ishchi bir bosqichga yetmaguncha keyingiga o‘tmaslik sinxronlashi.","reflect.select":"Reflect orqali dinamik channel select qilish.","dynamic select":"Channel case ro‘yxati runtime da tuziladigan select.","time.ticker":"Davriy vaqt hodisalari channelini taqdim etadi.","time.timer":"Bir martalik vaqt hodisasi.","time.after":"Muddatdan keyin receive qilinadigan channel qaytaradi.","time.tick":"Davriy channel qaytaradi; lifecycle muhokamasida Go versiyasiga qarang.","timeout":"Operatsiya uchun maksimal kutish muddati.","context.background":"Root context, cancellation va deadline mavjud emas.","context.todo":"Parent context hali tanlanmagan joy uchun ko‘rsatkich.","parent-child context":"Child parentning cancellation/deadline signallarini meros qiladigan model.","context internals":"Done channel, parent linkage, timer va cancellation state mexanizmlari.","context.withcancel":"Qo‘lda cancel qilinadigan context yaratadi.","withcancelcause":"Bekor bo‘lish sababini error ko‘rinishida belgilashga imkon beradi.","cancellation propagation":"Parent cancellationning childlarga tarqalishi.","context.withdeadline":"Ma’lum vaqtgacha ishlashi mumkin bo‘lgan context.","withtimeout":"Nisbiy vaqt davomida ishlash contexti.","deadline":"Bekor bo‘lish uchun absolyut vaqt chegarasi.","withdeadlinecause":"Deadline tugashining custom cause qiymatini belgilaydi.","withtimeoutcause":"Timeout tugash sababini belgilaydi.","withoutcancel":"Parent value bilan, lekin parent cancel/deadline mexanizmidan ajratilgan context.","context.withvalue":"Request-scoped metadata uchun contextga typed key/value qo‘shadi.","typed key":"Context value collisionsini kamaytiradigan private type kalit.","context anti-pattern":"Contextni config/dependency ombori qilish, cancelni unutish, nil uzatish kabi xatolar.","memory reordering":"Compiler/CPU ayrim mustaqil operatsiyalar tartibini o‘zgartirishi.","full barrier":"Kengroq read/write orderingni cheklaydigan apparat memory barrier tushunchasi.","read barrier":"Load ordering bilan bog‘liq cheklov.","write barrier":"Store ordering bilan bog‘liq cheklov.","acquire":"Synchronization nuqtasidan keyingi amallarni tegishli memory ordering bilan ko‘rish.","release":"Synchronizationdan oldingi amallarni boshqa oqimga publish qilish orderingi.","coarse locking":"Yirik ma’lumotlar to‘plamini bitta mutex bilan himoyalash.","fine-grained locking":"Har kichik segmentga alohida lock berish.","contention":"Bir resursga bir nechta ishchi bir vaqtda raqobat qilishi.","sharding":"Ma’lumotni hash yoki key asosida ko‘p mustaqil bo‘lakka bo‘lish.","hash(key)":"Keydan shard indexni barqaror hisoblab chiqarish.","independent locks":"Har bo‘limning o‘z mutexi bo‘lishi.","optimistic locking":"Avval o‘qib, keyin version yoki CAS bilan conflict bo‘lmaganda yozish.","version":"Ma’lumotning qaysi holat ekanini bildiruvchi o‘suvchi identifikator.","retry":"Conflict/vaqtinchalik xato bo‘lsa operationni nazoratli takrorlash.","rcu":"Read-Copy-Update: o‘qish uchun immutable snapshot, yozishda yangi nusxani publish qilish.","read-copy-update":"Readerlarni bloklamasdan snapshot almashtirish yo‘nalishi.","immutable state":"Publish qilgandan so‘ng o‘zgartirilmaydigan holat.","lock-free":"Har qanday individual thread progressi kafolatlanmasa ham tizim darajasida progress ta’minlanadigan nonblocking algoritm xossasi.","treiber stack":"Head pointer CASga asoslangan klassik lock-free LIFO stack.","head cas":"Stack head pointerini eski qiymat mos bo‘lsa atomik almashtirish.","michael–scott queue":"CAS bilan ishlaydigan klassik lock-free FIFO linked queue.","fifo":"First-In-First-Out: birinchi kelgan birinchi chiqadi.","head/tail cas":"Queue bosh va oxir pointerlarini compare-and-swap bilan yangilash.","sentinel":"Linked queue boshlanishi uchun placeholder tugun.","aba problem":"A→B→A o‘zgarishidan keyin CAS qiymat bir xil ko‘ringani sabab oraliq o‘zgarish yo‘qolishi.","tagged pointer":"Pointerga generation/version kabi tag qo‘shish yondashuvi.","hazard pointer":"Reader hali foydalanayotgan obyektni muddatidan oldin reclamation qilishdan himoya.","memory reclamation":"Endi kerak bo‘lmagan node/obyekt xotirasini xavfsiz qaytarish.","2pl":"Two-Phase Locking: lock olish va lock bo‘shatish bosqichlarini ajratuvchi transaction protokoli.","two-phase locking":"2PL protokoli; growing phase va shrinking phase.","shared/exclusive locks":"Bir nechta read lock va bitta write lock mosligi qoidalari.","mvcc":"Multi-Version Concurrency Control: readerlar snapshot bo‘yicha mos versiyani ko‘radi.","snapshot":"Ma’lum transaction/isolation nuqtasidagi izchil ma’lumot ko‘rinishi.","versions":"Satrning turli update vaqtlariga mos logical versiyalari.","vacuum":"PostgreSQLda kerak bo‘lmay qolgan row versiyalarini tozalash mexanizmi.","serializability":"Natija qandaydir ketma-ket transaction ijrosiga ekvivalent bo‘lishi.","write skew":"Transactionlar bir-biriga bog‘liq predicate/invariantni alohida yozish bilan buzishi mumkin bo‘lgan anomaliya.","isolation":"Transactionlar bir-birining oraliq natijalarini ko‘rish qoidalari.","amdahl law":"Parallel bo‘lmaydigan ulush maksimal tezlashishni cheklaydi.","parallel fraction":"Workloadning parallel bajariladigan ulushi.","scalability":"Yuk yoki resurslar o‘sganda tizimning samarali ishlash darajasi.","bottleneck":"Umumiy throughputni cheklovchi eng tor resurs.","actor model":"State egasi actor xabarlar orqali boshqariladigan concurrency modeli.","mailbox":"Actorga kelayotgan buyruqlar va xabarlar navbati.","web server architecture":"HTTP handler, router, middleware, connection pool, background worker va persistence qatlamlari.","worker pool":"Cheklangan ishchi goroutinelar navbatdan vazifa oladigan pattern.","bounded workers":"Bir vaqtda ishga qo‘yilgan workerlar soni cheklangan.","backpressure":"Qabul qiluvchi sekinlashganda yuboruvchi ham tezlikni kamaytirishi yoki kutishi.","cache synchronizer":"Bir necha cache nusxasini yangilanishlar bilan moslashtiruvchi komponent.","invalidation":"Cache entryni eskirgan deb belgilash yoki o‘chirish.","pub/sub":"Publisher xabar yuboradi, subscriberlar tegishli xabarlarni oladi; durability kafolati brokergacha farq qiladi.","ttl":"Time-To-Live — entryning maksimal yashash muddati.","periodic jobs":"Takrorlanadigan interval yoki cron-jadval bo‘yicha bajariladigan tasklar.","overlap":"Oldingi bajarilish tugamasidan yangi bir xil job boshlanishi.","leader election":"Ko‘p instancedan bittasini koordinatsiya qiluvchi leader tanlash mexanizmi.","batcher":"Bir nechta kichik operatsiyani bir katta operatsiya sifatida yig‘ib bajaruvchi komponent.","batch size":"Bitta flush ichidagi operatsiyalar soni chegarasi.","flush interval":"Batch qancha muddatdan keyin majburan flush qilinishi.","durability":"Tizim crash/restartdan keyin tasdiqlangan yozuvlarni saqlab qolish kafolati.","idempotency":"Bir operationni takror bajarish yakuniy natijani o‘zgartirmasligi xossasi.","network i/o":"“Network I/O” — sysmon, netpoller va handoff mavzusining tarkibiy tushunchasi. Netpoller socket tayyor bo‘lishini kuzatib kutayotgan Gni qayta uyg‘otadi.","runtime.gomaxprocs":"“runtime.GOMAXPROCS” — runtime scheduling api mavzusining tarkibiy tushunchasi. Gosched joriy Gning bajarilishini ixtiyoriy bo‘shatadi, Goexit shu Gni yakunlaydi, LockOSThread ayni OS threadga bog‘laydi.","normal/starvation mutex mode":"“Normal/starvation mutex mode” — livelock, starvation, priority inversion mavzusining tarkibiy tushunchasi. Livelockda ishchilar harakat qiladi, lekin natija yo‘q.","incorrect synchronized structure":"“Incorrect synchronized structure” — antipatternlar: local mutex, copy, defer mavzusining tarkibiy tushunchasi. Har request uchun yangi mutex yaratish umumiy mapni himoya qilmaydi.","rw mutex implementation":"“RW mutex implementation” — recursive, timed mutex, semaphore mavzusining tarkibiy tushunchasi. Recursive lock bir egadan qayta olishni talab qiladi; Go sync.Mutexda bunday funksiya yo‘q.","pool implementation":"“Pool implementation” — pool/once implementatsiyasi, linux futex mavzusining tarkibiy tushunchasi. Once uchun state va kutish signali, pool uchun qayta ishlatiladigan obyektlar ombori kerak.","once implementation":"“Once implementation” — pool/once implementatsiyasi, linux futex mavzusining tarkibiy tushunchasi. Once uchun state va kutish signali, pool uchun qayta ishlatiladigan obyektlar ombori kerak.","kernel mutex":"“Kernel mutex” — pool/once implementatsiyasi, linux futex mavzusining tarkibiy tushunchasi. Once uchun state va kutish signali, pool uchun qayta ishlatiladigan obyektlar ombori kerak.","sync.mutex internals":"“sync.Mutex internals” — pool/once implementatsiyasi, linux futex mavzusining tarkibiy tushunchasi. Once uchun state va kutish signali, pool uchun qayta ishlatiladigan obyektlar ombori kerak.","close ownership":"“Close ownership” — close, ok va double close mavzusining tarkibiy tushunchasi. Yopilgan va bo‘sh channeldan o‘qish zero value hamda `ok=false` qaytaradi.","send on closed":"“Send on closed” — close, ok va double close mavzusining tarkibiy tushunchasi. Yopilgan va bo‘sh channeldan o‘qish zero value hamda `ok=false` qaytaradi.","compare channel":"“Compare channel” — close, ok va double close mavzusining tarkibiy tushunchasi. Yopilgan va bo‘sh channeldan o‘qish zero value hamda `ok=false` qaytaradi.","copy channel":"“Copy channel” — close, ok va double close mavzusining tarkibiy tushunchasi. Yopilgan va bo‘sh channeldan o‘qish zero value hamda `ok=false` qaytaradi.","communication":"“Communication” — channel of channels, signals, broadcast mavzusining tarkibiy tushunchasi. Channel ichida channel yuborish orqali har bir request uchun reply channel berish mumkin.","parallel stages":"“Parallel stages” — fan-out, fan-in va tee mavzusining tarkibiy tushunchasi. Fan-out bitta inputni bir nechta workerga bo‘lib beradi.","channel cancellation":"“Channel cancellation” — timeout va graceful shutdown mavzusining tarkibiy tushunchasi. Timeoutlar tashqi IO kutishni chegaralaydi.","error propagation":"“Error propagation” — timeout va graceful shutdown mavzusining tarkibiy tushunchasi. Timeoutlar tashqi IO kutishni chegaralaydi.","cause":"“Cause” — withcancel va withcancelcause mavzusining tarkibiy tushunchasi. WithCancel qaytargan cancel bajarilganida child context va unga bog‘langan avlodlar bekor qilinadi.","errgroup":"“Errgroup” — errgroup, shutdown, custom timeout mavzusining tarkibiy tushunchasi. Bir nechta dependency query xatosida birgalikda cancel qilinadi.","own withtimeout implementation":"“Own WithTimeout implementation” — errgroup, shutdown, custom timeout mavzusining tarkibiy tushunchasi. Bir nechta dependency query xatosida birgalikda cancel qilinadi.","state ownership":"“State ownership” — actor model va web server mavzusining tarkibiy tushunchasi. Actor statega faqat o‘zi murojaat qiladi, boshqalar mail boxga xabar yuboradi.","ticker":"“Ticker” — scheduler va interval jobs mavzusining tarkibiy tushunchasi. Scheduler davriy ishni ishga tushiradi."}}</script><script>
const DATA=JSON.parse(document.getElementById('dataset').textContent);
const MODS=DATA.modules, DEFS=DATA.defs;
const ALL=MODS.flatMap(m=>m.topics.map(t=>({m,t})));
const STORAGE='go-concurrency-book-v2';
let state={done:{},theme:'light',expanded:{'m1':true},search:''};
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'{}');state={...state,...saved,search:''};}catch(e){}
let page='home', currentModule=1, currentTopic='m1-t1', menuOpen=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=()=>{try{localStorage.setItem(STORAGE,JSON.stringify({...state,search:''}));}catch(e){}};
const nDone=()=>Object.keys(state.done).filter(k=>state.done[k]).length;
const nTotal=()=>ALL.length;
function progress(){const p=Math.round(nDone()/nTotal()*100);$('#progressMini').style.width=p+'%';$('#progressLabel').textContent=nDone()+'/'+nTotal();}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.classList.remove('show'),2100);}
function selectPage(p,id){page=p;if(p==='lesson'&&id){currentTopic=id;currentModule=Number(id.match(/^m(\d+)/)?.[1]||1);state.expanded['m'+currentModule]=true;store();}if(p==='quiz'&&id)currentModule=Number(id);window.location.hash=p==='home'?'#/home':p==='project'?'#/project':p==='lesson'?'#/lesson/'+id:'#/quiz/'+currentModule;render();window.scrollTo(0,0);hideMenu();}
function hashRoute(){const parts=location.hash.replace(/^#\/?/,'').split('/');if(parts[0]==='lesson'&&ALL.some(x=>x.t.id===parts[1])){page='lesson';currentTopic=parts[1];currentModule=Number(parts[1].match(/m(\d+)/)?.[1]||1);state.expanded['m'+currentModule]=true;}else if(parts[0]==='quiz'&&MODS[Number(parts[1])-1]){page='quiz';currentModule=Number(parts[1]);state.expanded['m'+currentModule]=true;}else if(parts[0]==='project')page='project';else page='home';render();}
function highlight(src){let result='',last=0;const pattern=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|`[\s\S]*?`|\b\d+(?:\.\d+)?\b|\b(?:package|import|func|var|const|type|struct|interface|map|chan|go|defer|return|for|range|select|case|default|if|else|break|continue|switch|nil|true|false|make|new|close)\b|\b(?:fmt|sync|context|atomic|time|runtime|main|Println|Printf|Lock|Unlock|Load|Store|Add|Wait|Done|Close|Cancel|Get|Set|CompareAndSwap)\b)/g;
for(const match of src.matchAll(pattern)){const at=match.index;result+=esc(src.slice(last,at));const s=match[0];const cls=s.startsWith('//')||s.startsWith('/*')?'comment':s.startsWith('"')||s.startsWith('`')?'str':/^\d/.test(s)?'num':/^(package|import|func|var|const|type|struct|interface|map|chan|go|defer|return|for|range|select|case|default|if|else|break|continue|switch|nil|true|false|make|new|close)$/.test(s)?'kw':'fn';result+='<span class="tok-'+cls+'">'+esc(s)+'</span>';last=at+s.length;}return result+esc(src.slice(last));}
function renderSide(){const q=state.search.trim().toLocaleLowerCase();$('#searchInput').value=state.search;let count=0;
let body=MODS.map(m=>{const matched=m.topics.filter(t=>(m.title+' '+t.title+' '+t.terms.join(' ')+' '+t.theory).toLocaleLowerCase().includes(q));if(q&&!matched.length)return '';count+=matched.length;const opened=q?true:!!state.expanded[m.id];return `<section class="nav-mod ${opened?'open':''}"><button class="nav-mod-head ${currentModule===m.num&&page!=='home'?'selected':''}" data-toggle="${m.id}" aria-expanded="${opened}"><span class="num">${String(m.num).padStart(2,'0')}</span><span class="title">${esc(m.title)}</span><span class="chev">⌄</span></button><div class="nav-topics">${matched.map((t,i)=>`<button class="nav-topic ${page==='lesson'&&t.id===currentTopic?'active':''}" data-go="${t.id}"><span class="txt">${esc(t.title)}</span>${state.done[t.id]?'<span class="check">✓</span>':''}</button>`).join('')}</div></section>`}).join('');
$('#navModules').innerHTML=body||'<div class="empty">Qidiruv bo‘yicha mavzu topilmadi.</div>';$('#searchStatus').textContent=q?count+' ta mos dars':'';$('#navHome').classList.toggle('active',page==='home');progress();}
function footer(){return `<footer class="footer"><b>Go Concurrency · O‘zbekcha mustaqil qo‘llanma</b><div>Balun.Courses saytida ommaga ochiq 10 modul rejasidan ilhomlangan mustaqil izoh va kodlar. Rasmiy kurs darslari yoki ularning ko‘chirmasi emas. <a target="_blank" rel="noopener" href="https://balun.courses/courses/concurrency">Asl dastur sahifasi</a>.</div><div>Kodlarni Go 1.23+ muhitida tekshiring. Natijaning tartibi concurrent misollarda turlicha bo‘lishi mumkin. Bu HTML internetga ulanmasdan ishlaydi.</div></footer>`;}
function renderHome(){$('#crumb').textContent='Bosh sahifa';const p=Math.round(nDone()/nTotal()*100);return `<section class="hero"><span class="eyebrow">GO · CONCURRENCY · HIGHLOAD</span><h1>10 modul. 70 ta dars. 210 ta Go misol.</h1><p class="lead">Har bir darsda nazariya va tushunchalar, xavfli nozik jihatlar, so‘ng Junior → Middle → Senior darajasidagi uch bosqichli amaliy kod. Yon panelda barcha modul va darslar bor.</p><div class="cta"><button class="btn" data-action="start">${nDone()>0?'O‘qishni davom ettirish':'Birinchi darsni boshlash'} →</button><button class="btn ghost" data-page="project">Yakuniy loyiha: KV Database</button></div></section><div class="stats"><div class="stat"><strong>10</strong><span>Modul</span></div><div class="stat"><strong>70</strong><span>Batafsil dars</span></div><div class="stat"><strong>210</strong><span>Go kod misoli</span></div><div class="stat"><strong>${p}%</strong><span>O‘rganish progressi</span></div></div><div class="section"><h2>Qanday foydalaniladi?</h2><p><b>1.</b> Chap paneldan mavzuni tanlang. <b>2.</b> Oldin nazariyani, so‘ng atamalarning alohida izohini o‘qing. <b>3.</b> Har bir uch darajadagi Go kodni nusxalab, <code>go run main.go</code> bilan bajaring. <b>4.</b> “O‘qidim” ni bosing va modul oxiridagi testni topshiring.</p><div class="callout">O‘quv yo‘nalishi: dastlab 1–2-modul apparat va runtime, 3–7-modul kundalik production concurrency, 8–9-modul algoritmlar va DB, 10-modul real HighLoad patternlari.</div></div><h2 class="section-title">10 modul — to‘liq dastur</h2><div class="card-grid">${MODS.map(m=>`<button class="module-card" data-go="${m.topics[0].id}"><div class="row"><span class="index">MODUL ${String(m.num).padStart(2,'0')}</span><span class="pill">${m.topics.filter(t=>state.done[t.id]).length}/${m.topics.length} dars</span></div><h3>${esc(m.title)}</h3><p>${esc(m.summary)}</p></button>`).join('')}</div>${footer()}`;}
function exampleCard(e,i,t){const cls=i===0?'':i===1?'middle':'senior';return `<article class="example" id="example-${i+1}"><div class="example-head"><div><div class="level ${cls}">${esc(e.level)} · MISOL ${i+1}/3</div><h3>${esc(e.name)}</h3></div><span class="pill">Go</span></div><div class="code-wrap"><div class="code-actions"><span class="code-tag">main.go</span><button class="copy" data-copy="${esc(t.id)}:${i}">Nusxalash</button></div><pre><code>${highlight(e.code)}</code></pre></div><div class="example-foot"><div class="result"><b>Natija / kutiladigan holat</b><code>${esc(e.expected||'Muhit va schedulerga qarab o‘zgaradi')}</code></div><div class="why"><b>Nima uchun shunday ishlaydi?</b>${esc(e.why)}</div></div></article>`;}
function renderLesson(){const ref=ALL.find(x=>x.t.id===currentTopic)||ALL[0];const {m,t}=ref;currentModule=m.num;$('#crumb').textContent=`Modul ${m.num} / ${t.title}`;const idx=ALL.findIndex(x=>x.t.id===t.id);const done=!!state.done[t.id];const modulo=m.topics.indexOf(t)+1;return `<div class="path"><button class="small-btn" data-page="home">⌂ Dastur</button><span>›</span><span>${esc(m.title)}</span><span>›</span><b>${modulo}/${m.topics.length}</b></div><div class="sticky-progress"><span style="width:${(modulo/m.topics.length)*100}%"></span></div><div class="lesson-head"><div class="eyebrow">MODUL ${String(m.num).padStart(2,'0')} · DARS ${modulo}/${m.topics.length}</div><h1>${esc(t.title)}</h1><p class="lead">${esc(m.goal)}</p><div class="lesson-meta"><span class="pill">${t.terms.length} ta atama</span><span class="pill">3 ta amaliy kod</span><span class="pill">Offline</span>${done?'<span class="pill">✓ O‘qilgan</span>':''}</div></div><section class="section" id="theory"><h2>01. Nazariya — bu nima va qanday ishlaydi?</h2><p>${esc(t.theory)}</p><h3>Nima uchun backendda kerak?</h3><p>${esc(m.summary)} Bu mavzuni tushunish parallel requestlar, background workerlar, memory sarfi va concurrency xatolarini ongli boshqarishga yordam beradi.</p><div class="callout warning"><b>Diqqat — eng muhim nozik jihat:</b> ${esc(t.risk)}</div></section><section class="section" id="concepts"><h2>02. Ichidagi mavzular — alohida izohlar</h2><p>Har bir atamani ochib ko‘ring. Bu ro‘yxat moduldagi kichik tushunchalarni qamrab oladi.</p><div class="termlist">${t.terms.map(term=>`<details class="term"><summary>${esc(term)}</summary><p>${esc(DEFS[term.toLocaleLowerCase()]||t.theory)}</p></details>`).join('')}</div></section><h2 class="examples-title" id="examples">03. Go'da 3 ta amaliy kod</h2><p class="examples-intro">Misollar soddadan murakkabga qarab tartiblangan. Har birida kod, kutiladigan natija va “nima uchun” izohi bor.</p>${t.examples.map((e,i)=>exampleCard(e,i,t)).join('')}<section class="task-box"><div class="eyebrow">O‘ZINGIZ BAJARING</div><h3>04. Mustahkamlash vazifasi</h3><p>${esc(t.drill)}</p><p class="micro" style="margin-top:10px">Terminal: <code>go run main.go</code> · Sinov: <code>go test -race ./...</code> · Go versiyasi: <code>go version</code></p></section><div class="lesson-bottom"><button class="checkbtn ${done?'done':''}" data-done="${t.id}">${done?'✓ O‘qilgan deb belgilangan':'○ Mavzuni o‘qidim'}</button><button class="small-btn" data-page="quiz:${m.num}">Modul ${m.num} testi ↗</button></div><div class="nav-prevnext">${idx>0?`<button data-go="${ALL[idx-1].t.id}">← Oldingi: ${esc(ALL[idx-1].t.title)}</button>`:'<span></span>'}${idx+1<ALL.length?`<button data-go="${ALL[idx+1].t.id}">Keyingi: ${esc(ALL[idx+1].t.title)} →</button>`:`<button data-page="project">Yakuniy loyihaga o‘tish →</button>`}</div>${footer()}`;}
function renderQuiz(){const m=MODS[currentModule-1];$('#crumb').textContent=`Modul ${m.num} / Test`;return `<div class="eyebrow">BILIMNI TEKSHIRISH</div><h1>Modul ${m.num}: test</h1><p class="lead">${esc(m.title)}. 3 ta savol, har birida bitta to‘g‘ri javob. Javobni tanlab natijani tekshiring.</p><form id="quizForm" data-module="${m.num}">${m.quiz.map((q,i)=>`<div class="quiz-card"><div class="eyebrow">SAVOL ${i+1}/3</div><h3>${esc(q.q)}</h3>${q.options.map((o,j)=>`<label class="quiz-option"><input type="radio" name="question-${i}" value="${j}" required> ${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn" type="submit">Javoblarni tekshirish</button><div class="quiz-result" id="quizResult"></div></form><div class="nav-prevnext"><button data-go="${m.topics[0].id}">← Modulga qaytish</button><button data-go="${MODS[m.num]?.topics[0]?.id||m.topics[m.topics.length-1].id}">Keyingi modul →</button></div>${footer()}`;}
function renderProject(){$('#crumb').textContent='Yakuniy loyiha / In-memory DB';return `<div class="eyebrow">CAPSTONE PROJECT · HIGHLOAD</div><h1>Go'da In-Memory Key–Value DB</h1><p class="lead">Modullarning hammasini birlashtiradigan amaliy loyiha: TCP orqali SET/GET/DELETE, concurrent in-memory storage, WAL, recovery va leader→replica asinxron replikatsiya.</p><div class="section"><h2>Arxitektura</h2><pre class="micro" style="white-space:pre;overflow:auto;line-height:1.9">CLI client → TCP server → Parser → Storage Engine
                                     ├── Sharded Map + RWMutex
                                     ├── WAL Writer → fsync → Disk
                                     └── Replicator → Replica Node
                             Shutdown + Context + Workers</pre><div class="callout">Bu loyiha kurs dasturidagi yakuniy g‘oyaga mos mustaqil amaliy loyiha rejasidir; rasmiy kursning ichki materiallari emas.</div></div><div class="section"><h2>10 bosqichli ish rejasi</h2>${MODS.map(m=>`<div class="project-step"><div class="bubble">${m.num}</div><div><h3>${esc(m.title)}</h3><p>${esc(m.homework)}</p><button class="small-btn" style="margin-top:7px" data-go="${m.topics[0].id}">Modul darslariga o‘tish</button></div></div>`).join('')}</div><section class="section"><h2>Production checklist</h2><p>✓ Race detector va stress test; ✓ WAL flush/fsync strategiyasi; ✓ bounded queue; ✓ retry va idempotency; ✓ recovery testlari; ✓ replikatsiyada offset va lag; ✓ contextli shutdown; ✓ metrics va pprof; ✓ benchmark (RPS/latency); ✓ ma’lumot izchilligi va xato holatlari.</p></section>${footer()}`;}
function render(){document.documentElement.dataset.theme=state.theme;$('#themeBtn').textContent=state.theme==='dark'?'☀️ Yorug‘':'🌙 Tungi';renderSide();$('#content').innerHTML=page==='home'?renderHome():page==='lesson'?renderLesson():page==='quiz'?renderQuiz():renderProject();document.title=(page==='lesson'?ALL.find(x=>x.t.id===currentTopic)?.t.title+' — ':'')+'Go Concurrency — o‘zbekcha qo‘llanma';}
function hideMenu(){menuOpen=false;$('#sidebar').classList.remove('visible');$('#overlay').classList.remove('visible');}
function showMenu(){menuOpen=true;$('#sidebar').classList.add('visible');$('#overlay').classList.add('visible');}
document.addEventListener('click',async ev=>{const e=ev.target.closest('[data-go],[data-toggle],[data-page],[data-done],[data-copy],[data-action]');if(!e)return;
if(e.dataset.go){selectPage('lesson',e.dataset.go);return;}
if(e.dataset.toggle){const id=e.dataset.toggle;state.expanded[id]=!state.expanded[id];store();renderSide();return;}
if(e.dataset.page){const p=e.dataset.page;if(p.startsWith('quiz:'))selectPage('quiz',p.split(':')[1]);else selectPage(p);return;}
if(e.dataset.dFlag){return;}
if(e.dataset.done){const id=e.dataset.done;state.done[id]=!state.done[id];store();render();toast(state.done[id]?'O‘qilgan deb belgilandi':'Belgi olib tashlandi');return;}
if(e.dataset.action==='start'){const next=ALL.find(x=>!state.done[x.t.id])||ALL[0];selectPage('lesson',next.t.id);return;}
if(e.dataset.copy){const [id,idx]=e.dataset.copy.split(':');const row=ALL.find(x=>x.t.id===id);if(!row)return;const code=row.t.examples[+idx].code;try{await navigator.clipboard.writeText(code)}catch{const ta=document.createElement('textarea');ta.value=code;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();}toast('Go kod nusxalandi');return;}
});
document.addEventListener('submit',ev=>{if(ev.target.id!=='quizForm')return;ev.preventDefault();const m=MODS[currentModule-1];let correct=0;let notes=[];m.quiz.forEach((q,i)=>{const checked=ev.target.querySelector('input[name="question-'+i+'"]:checked');const x=checked?+checked.value:-1;if(x===q.correct)correct++;notes.push((x===q.correct?'✓ ':'✕ ')+q.reason)});const r=$('#quizResult');r.classList.add('visible');r.innerHTML='<b>Natija: '+correct+'/3</b><div style="margin-top:10px">'+notes.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';r.scrollIntoView({behavior:'smooth',block:'nearest'});});
$('#searchInput').addEventListener('input',ev=>{state.search=ev.target.value;renderSide();});$('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';store();render();});$('#hamburger').addEventListener('click',()=>menuOpen?hideMenu():showMenu());$('#overlay').addEventListener('click',hideMenu);$('#navHome').addEventListener('click',()=>selectPage('home'));
$('#clearProgress').addEventListener('click',()=>{if(confirm('70 ta darsning o‘qilgan belgilarini tozalaysizmi?')){state.done={};store();render();toast('Progress tozalandi')}});
$('#expandAll').addEventListener('click',()=>{const allOpen=MODS.every(m=>state.expanded[m.id]);MODS.forEach(m=>state.expanded[m.id]=!allOpen);store();renderSide()});
document.addEventListener('keydown',e=>{const typing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);if(e.key==='Escape')hideMenu();if(e.key==='/'&&!typing){e.preventDefault();if(innerWidth<=720)showMenu();$('#searchInput').focus()}if(!typing&&page==='lesson'&&e.altKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const i=ALL.findIndex(x=>x.t.id===currentTopic),n=i+(e.key==='ArrowRight'?1:-1);if(ALL[n])selectPage('lesson',ALL[n].t.id)}});
window.addEventListener('hashchange',hashRoute);hashRoute();
</script></body></html>
