<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Learning Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 40px;
            font-size: 32px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: white;
            display: inline-block;
        }

        .basic {
            background: #00c6ff;
        }

        .advanced {
            background: #ff7e5f;
        }

        .sql {
            background: #43cea2;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 Learning Dashboard</h1>

        <div class="buttons">
            <a href="les/golang1.html" target="_blank" class="btn basic">
                Golang Basic
            </a>

            <a href="les/golang2.html" target="_blank" class="btn advanced">
                Golang Advanced
            </a>

            <a href="les/sql.html" target="_blank" class="btn sql">
                SQL
            </a>
        </div>
    </div>

</body>

</html>
